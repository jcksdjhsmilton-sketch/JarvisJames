name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Criar o projeto Android inteiro
        run: |
          set -e
          mkdir -p jarvis/app/src/main/kotlin/br/local/jarvis

          cat > jarvis/settings.gradle.kts <<'JVEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisLocal"
          include(":app")
          JVEOF

          cat > jarvis/build.gradle.kts <<'JVEOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          JVEOF

          cat > jarvis/gradle.properties <<'JVEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          JVEOF

          cat > jarvis/app/build.gradle.kts <<'JVEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          kotlin {
              compilerOptions {
                  optIn.add("com.google.ai.edge.litertlm.ExperimentalApi")
                  freeCompilerArgs.add("-Xskip-metadata-version-check")
              }
          }

          android {
              namespace = "br.local.jarvis"
              compileSdk = 36
              defaultConfig {
                  applicationId = "br.local.jarvis"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              packaging {
                  jniLibs {
                      pickFirsts += "**/libc++_shared.so"
                  }
              }
          }

          dependencies {
              implementation("com.google.ai.edge.litertlm:litertlm-android:latest.release")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          JVEOF

          cat > jarvis/app/src/main/AndroidManifest.xml <<'JVEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH"/>
                  </intent>
              </queries>
              <application
                  android:label="Jarvis Local"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <uses-native-library android:name="libvndksupport.so" android:required="false"/>
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          JVEOF

          cat > jarvis/app/src/main/kotlin/br/local/jarvis/MainActivity.kt <<'JVEOF'
