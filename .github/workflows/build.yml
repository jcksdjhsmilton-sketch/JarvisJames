              private fun sendTyped() {
                  val t = inputEt.text.toString().trim()
                  if (t.isEmpty()) return
                  if (busy) {
                      toast("Aguarde eu terminar a resposta atual.")
                      return
                  }
                  inputEt.setText("")
                  onUserText(t, true)
              }

              private fun initTts() {
                  tts = TextToSpeech(this, TextToSpeech.OnInitListener { st ->
                      if (st == TextToSpeech.SUCCESS) {
                          val t = tts
                          if (t != null) {
                              val r = t.setLanguage(Locale("pt", "BR"))
                              ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED
                              t.setSpeechRate(gf("rate", 1.0f))
                              t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) setState(St.SPEAKING)
                                      }
                                  }
                                  override fun onDone(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) ttsDone()
                                      }
                                  }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) ttsDone()
                                      }
                                  }
                              })
                              logd("TTS iniciado. pt-BR disponível: " + ttsReady)
                              if (!ttsReady) {
                                  setStatus("Voz pt-BR do celular não encontrada. Veja Ajustes > Ajustar a voz do celular.")
                              }
                          }
                      } else {
                          logd("TTS falhou ao iniciar (código " + st + ")")
                      }
                      ttsInit = true
                      maybeGreet()
                  })
              }

              private fun epochOk(id: String?): Boolean = id != null && id.startsWith("e" + ttsEpoch + "-")

              private fun ttsDone() {
                  if (ttsPending > 0) ttsPending--
                  if (ttsPending == 0 && genDone) finishTurn()
              }

              private fun speakSentence(s: String) {
                  if (!speakOn || !ttsReady) return
                  val c = cleanForSpeech(s)
                  if (c.length < 2) return
                  ttsPending++
                  utt++
                  tts?.speak(c, TextToSpeech.QUEUE_ADD, null, "e" + ttsEpoch + "-" + utt)
              }

              private fun stopSpeaking() {
                  if (state == St.SPEAKING || ttsPending > 0) {
                      ttsEpoch++
                      tts?.stop()
                      ttsPending = 0
                      speakOn = false
                      if (genDone) finishTurn() else setState(St.THINKING)
                  }
              }

              private fun cleanForSpeech(s: String): String {
                  var t = s.replace(Regex("(?s)<think>.*?(</think>|\\z)"), " ")
                  t = t.replace(Regex("\\[([^\\]]*)]\\([^)]*\\)"), "\$1")
                  t = t.replace(Regex("https?://\\S+"), " ")
                  t = t.replace(Regex("(?m)^\\s*[-•*]\\s+"), "")
                  val sb = StringBuilder()
                  var i = 0
                  while (i < t.length) {
                      val cp = t.codePointAt(i)
                      i += Character.charCount(cp)
                      val keep = Character.isLetterOrDigit(cp) || Character.isWhitespace(cp) ||
                          (cp < 128 && ".,;:!?'-()%/+\"".indexOf(cp.toChar()) >= 0) || cp == 0x2026
                      if (keep) sb.appendCodePoint(cp)
                  }
                  return sb.toString().replace(Regex("\\s+"), " ").trim()
              }

              private fun visibleText(raw: String): String {
                  var t = raw.replace(Regex("(?s)<think>.*?</think>"), "").replace("</think>", "")
                  val i = t.indexOf("<think>")
                  if (i >= 0) t = t.substring(0, i)
                  val tag = "<think>"
                  var k = minOf(tag.length - 1, t.length)
                  while (k >= 1) {
                      if (t.endsWith(tag.substring(0, k))) {
                          t = t.substring(0, t.length - k)
                          break
                      }
                      k--
                  }
                  return t.trimStart()
              }

              private fun extractSentences(buf: StringBuilder, fin: Boolean): List<String> {
                  val out = ArrayList<String>()
                  while (true) {
                      var cut = -1
                      for (i in 0 until buf.length) {
                          val ch = buf[i]
                          if (ch == '\n') {
                              cut = i
                              break
                          }
                          if (ch == '.' || ch == '!' || ch == '?' || ch == '…') {
                              if (i + 1 < buf.length && buf[i + 1].isWhitespace() && i >= 6) {
                                  cut = i
                                  break
                              }
                              if (fin && i + 1 == buf.length) {
                                  cut = i
                                  break
                              }
                          }
                      }
                      if (cut < 0) break
                      out.add(buf.substring(0, cut + 1))
                      buf.delete(0, cut + 1)
                  }
                  if (fin && buf.isNotBlank()) {
                      out.add(buf.toString())
                      buf.setLength(0)
                  }
                  return out
              }

              private fun reply(text: String) {
                  busy = true
                  speakOn = true
                  genDone = true
                  appendConvo(assistantName(), text)
                  val sb = StringBuilder(text)
                  for (s in extractSentences(sb, true)) speakSentence(s)
                  if (ttsPending == 0) finishTurn()
              }

              private fun finishTurn() {
                  busy = false
                  setState(St.IDLE)
                  if (gb("cont", false) && lastVoice && ready && !downloading) {
                      ui.postDelayed({
                          if (state == St.IDLE && !busy) startListening()
                      }, 500)
                  }
              }

              private fun greeting(): String {
                  val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  return if (h < 12) "Bom dia" else if (h < 18) "Boa tarde" else "Boa noite"
              }

              private fun maybeGreet() {
                  if (!ready || !ttsInit) return
                  if (notice.isNotEmpty()) {
                      val n = notice
                      notice = ""
                      reply(n)
                      return
                  }
                  if (!greeted) {
                      greeted = true
                      reply(greeting() + ", eu sou " + assistantName() + ". Estou pronto quando quiser.")
                  }
              }

              private fun ensureMic(): Boolean {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) return true
                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 11)
                  return false
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 11) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          logd("Microfone liberado")
                          checkOffline()
                      } else {
                          setStatus("Sem permissão de microfone. Use a caixa de texto ou libere nas configurações do app.")
                      }
                  }
              }

              private fun checkOffline() {
                  if (Build.VERSION.SDK_INT < 33) {
                      offlineOk = null
                      return
                  }
                  try {
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      r.checkRecognitionSupport(i, mainExecutor, object : RecognitionSupportCallback {
                          override fun onSupportResult(recognitionSupport: RecognitionSupport) {
                              val inst = recognitionSupport.installedOnDeviceLanguages
                              var has = false
                              for (l in inst) {
                                  if (l.lowercase().startsWith("pt")) has = true
                              }
                              offlineOk = has
                              logd("Voz offline instalada: " + inst + " -> pt: " + has)
                              r.destroy()
                              refreshDiag()
                              if (!has && !gb("help_shown", false)) {
                                  prefs.edit().putBoolean("help_shown", true).apply()
                                  runOnUiThread { showVoiceHelp() }
                              }
                          }
                          override fun onError(error: Int) {
                              logd("checkRecognitionSupport erro " + error)
                              r.destroy()
                          }
                      })
                  } catch (t: Throwable) {
                      logd("checkOffline falhou: " + t.message)
                  }
              }

              private fun showVoiceHelp() {
                  val msg = "Para o app ouvir você SEM internet, baixe o pacote de voz offline:\n\n" +
                      "1. Abra as Configurações do celular > Google > Configurações para apps do Google > Pesquisa, Assistente e Voz > Voz > Reconhecimento de voz offline.\n" +
                      "2. Na aba 'Todos', toque em 'Português (Brasil)' e baixe.\n\n" +
                      "Os nomes dos menus mudam um pouco conforme o aparelho. Enquanto o pacote não estiver instalado, o app pode usar o reconhecimento ONLINE do Google (seu áudio é enviado ao Google). Um aviso aparece na tela quando isso acontecer."
                  val b = AlertDialog.Builder(this)
                  b.setTitle("Voz offline em português")
                  b.setMessage(msg)
                  b.setPositiveButton("Abrir ajustes de voz") { _, _ ->
                      try {
                          startActivity(Intent(Settings.ACTION_VOICE_INPUT_SETTINGS))
                      } catch (t: Throwable) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }
                  b.setNegativeButton("Fechar") { _, _ -> }
                  if (Build.VERSION.SDK_INT >= 33) {
                      b.setNeutralButton("Tentar baixar aqui") { _, _ ->
                          try {
                              val r = SpeechRecognizer.createSpeechRecognizer(this)
                              val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                              r.triggerModelDownload(i)
                              toast("Pedi o download do pacote. Pode levar alguns minutos.")
                          } catch (t: Throwable) {
                              toast("Não consegui pedir o download: " + t.message)
                          }
                      }
                  }
                  b.show()
              }

              private fun startListening() {
                  if (state == St.LISTENING) {
                      try {
                          recognizer?.cancel()
                      } catch (t: Throwable) {
                      }
                      setState(St.IDLE)
                      return
                  }
                  if (!ensureMic()) return
                  if (!ready) {
                      setStatus("Ainda carregando o modelo…")
                      return
                  }
                  if (busy) return
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      setStatus("Reconhecimento de voz indisponível neste aparelho.")
                      showVoiceHelp()
                      return
                  }
                  try {
                      recognizer?.destroy()
                  } catch (t: Throwable) {
                  }
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {
                          orb.level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f)
                      }
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                      override fun onPartialResults(partialResults: Bundle?) {
                          val l = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val p = l?.firstOrNull()
                          if (p != null && p.isNotBlank()) setStatus("Ouvindo: " + p)
                      }
                      override fun onResults(results: Bundle?) {
                          orb.level = 0f
                          val l = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val t = l?.firstOrNull()
                          setState(St.IDLE)
                          if (t == null || t.isBlank()) {
                              onListenFail(7)
                          } else {
                              noSpeechCount = 0
                              onUserText(t, false)
                          }
                      }
                      override fun onError(error: Int) {
                          orb.level = 0f
                          onListenFail(error)
                      }
                  })
                  val ri = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                  ri.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                  ri.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  ri.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  ri.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                  setState(St.LISTENING)
                  r.startListening(ri)
              }

              private fun onListenFail(e: Int) {
                  val msg = when (e) {
                      1 -> "tempo de rede esgotado"
                      2 -> "erro de rede (o pacote offline pode estar faltando)"
                      3 -> "erro de áudio"
                      4 -> "erro no servidor de voz"
                      5 -> "erro do cliente de voz"
                      6 -> "não ouvi nada"
                      7 -> "não entendi"
                      8 -> "reconhecedor ocupado"
                      9 -> "falta permissão de microfone"
                      10 -> "muitos pedidos"
                      11 -> "serviço de voz desconectado"
                      12 -> "idioma pt-BR não suportado"
                      13 -> "idioma pt-BR indisponível (baixe o pacote offline)"
                      else -> "erro " + e
                  }
                  logd("Voz: " + msg + " (código " + e + ")")
                  setState(St.IDLE)
                  if (e == 6 || e == 7) {
                      noSpeechCount++
                      if (gb("cont", false) && noSpeechCount < 3) {
                          ui.postDelayed({
                              if (state == St.IDLE && !busy) startListening()
                          }, 400)
                      } else if (noSpeechCount >= 3) {
                          noSpeechCount = 0
                          setStatus("Conversa contínua em pausa. Toque no microfone para continuar.")
                      }
                  } else if (e == 12 || e == 13 || e == 2) {
                      showVoiceHelp()
                  } else if (e != 5) {
                      setStatus("Voz: " + msg)
                  }
              }

              private fun onUserText(raw: String, typed: Boolean) {
                  var text = raw.trim()
                  if (text.isEmpty()) return
                  lastVoice = !typed
                  val pa = pendingAction
                  if (pa != null) {
                      val n = norm(text)
                      if (Regex("\\b(nao|cancela|cancelar|deixa|esquece|negativo)\\b").containsMatchIn(n)) {
                          pendingDialog?.dismiss()
                          pendingAction = null
                          appendConvo("Você", text)
                          reply("Cancelado.")
                          return
                      }
                      if (Regex("\\b(sim|confirmo|confirma|pode|claro|isso mesmo|ok|manda ver|vai)\\b").containsMatchIn(n)) {
                          pendingDialog?.dismiss()
                          pendingAction = null
                          appendConvo("Você", text)
                          pa()
                          return
                      }
                      pendingDialog?.dismiss()
                      pendingAction = null
                  }
                  if (!typed && gb("wake", false)) {
                      if (!norm(text).contains(norm(assistantName()))) {
                          logd("Ignorado (sem o nome): " + text)
                          finishTurn()
                          return
                      }
                      text = Regex(Regex.escape(assistantName()), RegexOption.IGNORE_CASE).replace(text, " ").trim(' ', ',', '.', '!', '?')
                      if (text.isEmpty()) text = "Olá"
                  }
                  if (downloading) {
                      appendConvo("Você", text)
                      reply("Estou baixando o modelo. Aguarde terminar.")
                      return
                  }
                  appendConvo("Você", text)
                  if (handleCommand(text)) return
                  ask(text)
              }

              private fun confirm(desc: String, action: () -> Unit) {
                  pendingAction = action
                  runOnUiThread {
                      pendingDialog?.dismiss()
                      val b = AlertDialog.Builder(this)
                      b.setMessage(desc + "\n\n(Você também pode dizer 'sim' ou 'não'.)")
                      b.setPositiveButton("Confirmar") { _, _ ->
                          val a = pendingAction
                          pendingAction = null
                          if (a != null) a()
                      }
                      b.setNegativeButton("Cancelar") { _, _ ->
                          pendingAction = null
                          reply("Cancelado.")
                      }
                      b.setOnCancelListener { pendingAction = null }
                      pendingDialog = b.show()
                  }
                  reply(desc + " Confirma?")
              }

              private fun tryStart(i: Intent, okMsg: String, failMsg: String) {
                  try {
                      startActivity(i)
                      reply(okMsg)
                  } catch (t: Throwable) {
                      logd("Intent falhou: " + t.message)
                      reply(failMsg)
                  }
              }

              private fun setTorch(on: Boolean): Boolean {
                  val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  for (id in cm.cameraIdList) {
                      val ch = cm.getCameraCharacteristics(id)
                      val flash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE)
                      if (flash == true) {
                          cm.setTorchMode(id, on)
                          torchOn = on
                          return true
                      }
                  }
                  return false
              }

              private fun findApp(q: String): Pair<String, String>? {
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN)
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER)
                  var best: Pair<String, String>? = null
                  var bestScore = 0
                  for (ri in pm.queryIntentActivities(mainIntent, 0)) {
                      val lab = ri.loadLabel(pm).toString()
                      val ln = norm(lab)
                      var score = 0
                      if (ln == q) score = 100
                      else if (ln.startsWith(q)) score = 80
                      else if (ln.contains(q)) score = 60
                      else if (ln.length >= 3 && q.contains(ln)) score = 50
                      if (score > bestScore) {
                          bestScore = score
                          best = Pair(lab, ri.activityInfo.packageName)
                      }
                  }
                  return best
              }

              private fun handleCommand(text: String): Boolean {
                  val n = norm(text)

                  val noteM = Regex("^(?:lembre-se|lembre se|lembre|anote|guarde|memorize)\\s+(?:que\\s+|de\\s+)?(.+)\$", RegexOption.IGNORE_CASE).find(text.trim())
                  if (noteM != null) {
                      addNote(noteM.groupValues[1])
                      reply("Anotado. Vou me lembrar disso.")
                      return true
                  }

                  if (Regex("\\b(que horas|as horas|horas sao|hora atual|horario)\\b").containsMatchIn(n)) {
                      val cal = Calendar.getInstance()
                      val h = cal.get(Calendar.HOUR_OF_DAY)
                      val m = cal.get(Calendar.MINUTE)
                      val hs = when (h) {
                          0 -> "É meia-noite"
                          1 -> "É uma hora"
                          12 -> "É meio-dia"
                          else -> "São " + h + " horas"
                      }
                      val ms = if (m > 0) " e " + m + (if (m > 1) " minutos" else " minuto") else ""
                      reply(hs + ms + ".")
                      return true
                  }

                  if (Regex("\\b(que dia e hoje|data de hoje|qual a data|que data)\\b").containsMatchIn(n)) {
                      val f = SimpleDateFormat("EEEE, d 'de' MMMM 'de' yyyy", Locale("pt", "BR"))
                      reply("Hoje é " + f.format(Date()) + ".")
                      return true
                  }

                  if (n.contains("lanterna")) {
                      val on: Boolean
                      if (n.contains("apag") || n.contains("deslig")) on = false
                      else if (n.contains("acend") || n.contains("lig")) on = true
                      else on = !torchOn
                      try {
                          if (setTorch(on)) reply(if (on) "Lanterna ligada." else "Lanterna apagada.")
                          else reply("Não encontrei o flash neste aparelho.")
                      } catch (t: Throwable) {
                          logd("Lanterna: " + t.message)
                          reply("Não consegui acessar a lanterna.")
                      }
                      return true
                  }

                  if (n.contains("timer") || n.contains("temporizador") || n.contains("cronometro")) {
                      val tm = Regex("(\\d{1,4})\\s*(segundos|segundo|seg|minutos|minuto|min|horas|hora)\\b").find(n)
                      if (tm == null) {
                          reply("De quanto tempo deve ser o timer?")
                          return true
                      }
                      val v = tm.groupValues[1].toInt()
                      val u = tm.groupValues[2]
                      val secs = if (u.startsWith("seg")) v else if (u.startsWith("min")) v * 60 else v * 3600
                      confirm("Criar um timer de " + v + " " + u + "?") {
                          val i = Intent(AlarmClock.ACTION_SET_TIMER)
                          i.putExtra(AlarmClock.EXTRA_LENGTH, secs)
                          i.putExtra(AlarmClock.EXTRA_MESSAGE, assistantName())
                          i.putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          tryStart(i, "Timer criado.", "Não consegui criar o timer.")
                      }
                      return true
                  }

                  if (n.contains("alarme") || n.contains("despertador")) {
                      var h = -1
                      var mi = 0
                      val a = Regex("(\\d{1,2})\\s*(?::|h|horas|hora)\\s*(?:e\\s*)?(\\d{1,2})?").find(n)
                      val b = Regex("(\\d{1,2})\\s+e\\s+(\\d{1,2})").find(n)
                      val c = Regex("\\b(\\d{1,2})\\b").find(n)
                      if (a != null) {
                          h = a.groupValues[1].toInt()
                          mi = a.groupValues[2].toIntOrNull() ?: 0
                      } else if (b != null) {
                          h = b.groupValues[1].toInt()
                          mi = b.groupValues[2].toInt()
                      } else if (c != null) {
                          h = c.groupValues[1].toInt()
                      }
                      if ((n.contains("da tarde") || n.contains("da noite")) && h in 1..11) h += 12
                      if (h < 0 || h > 23 || mi > 59) {
                          reply("Para que horas devo criar o alarme?")
                          return true
                      }
                      val hh = h
                      val mm = mi
                      confirm("Criar um alarme para " + String.format(Locale.US, "%02d:%02d", hh, mm) + "?") {
                          val i = Intent(AlarmClock.ACTION_SET_ALARM)
                          i.putExtra(AlarmClock.EXTRA_HOUR, hh)
                          i.putExtra(AlarmClock.EXTRA_MINUTES, mm)
                          i.putExtra(AlarmClock.EXTRA_MESSAGE, assistantName())
                          i.putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          tryStart(i, "Alarme criado.", "Não consegui criar o alarme.")
                      }
                      return true
                  }

                  val om = Regex("^(?:abrir|abra|abre|iniciar|inicie|execute|executar)\\s+(?:o |a |os |as )?(?:aplicativo |app )?(.+)\$").find(n)
                  if (om != null) {
                      val q = om.groupValues[1].trim()
                      val app = findApp(q)
                      if (app == null) {
                          reply("Não encontrei um aplicativo chamado " + q + ".")
                      } else {
                          confirm("Abrir o aplicativo " + app.first + "?") {
                              val li = packageManager.getLaunchIntentForPackage(app.second)
                              reply("Abrindo " + app.first + ".")
                              if (li != null) {
                                  ui.postDelayed({ startActivity(li) }, 1500)
                              }
                          }
                      }
                      return true
                  }
                  return false
              }

              private fun loadHistory(): List<Pair<Boolean, String>> {
                  val raw = gs("hist", "")
                  if (raw.isEmpty()) return emptyList()
                  val out = ArrayList<Pair<Boolean, String>>()
                  for (line in raw.split("\n")) {
                      if (line.length < 3) continue
                      out.add(Pair(line[0] == 'U', line.substring(2)))
                  }
                  return out
              }

              private fun addHistory(u: String, a: String) {
                  val l = loadHistory().toMutableList()
                  l.add(Pair(true, u))
                  l.add(Pair(false, a))
                  val sb = StringBuilder()
                  for (p in l.takeLast(12)) {
                      sb.append(if (p.first) "U " else "A ").append(p.second.replace("\n", " ").take(300)).append("\n")
                  }
                  prefs.edit().putString("hist", sb.toString().trimEnd()).apply()
              }

              private fun notes(): List<String> = gs("notes", "").split("\n").filter { it.isNotBlank() }

              private fun addNote(n: String) {
                  val l = notes().toMutableList()
                  l.add(n.take(200))
                  prefs.edit().putString("notes", l.takeLast(20).joinToString("\n")).apply()
                  resetPending = true
              }

              private fun buildSystemPrompt(): String {
                  val persona = gs("persona", DEFAULT_PERSONA).replace("{nome}", assistantName())
                  val n = notes()
                  return persona + (if (n.isEmpty()) "" else "\nFatos que o usuário pediu para você lembrar: " + n.joinToString("; ") + ".") +
                      "\nData e hora atuais: " + nowStr() + ". Você tem acesso à internet: quando a mensagem do usuário trouxer resultados de pesquisa, baseie-se neles e não invente fatos. Se não tiver certeza, diga que não sabe."
              }

              private fun makeConfig(m: ModelInfo, f: File, be: String): EngineConfig {
                  val backendObj = if (be == "gpu") Backend.GPU() else Backend.CPU()
                  val maxTok: Int? = 2048
                  return EngineConfig(
                      modelPath = f.absolutePath,
                      backend = backendObj,
                      maxNumTokens = maxTok,
                      cacheDir = cacheDir.absolutePath
                  )
              }

              private fun releaseEngine() {
                  ready = false
                  try {
                      conversation?.close()
                  } catch (t: Throwable) {
                  }
                  conversation = null
                  try {
                      engine?.close()
                  } catch (t: Throwable) {
                  }
                  engine = null
                  System.gc()
              }

              private fun loadModelOrOffer() {
                  val m = curModel()
                  if (hasModel(m)) {
                      loadModel()
                  } else {
                      setStatus("Modelo " + m.label + " ainda não baixado.")
                      offerDownload(m)
                  }
              }

              private fun loadModel(forceBench: Boolean = false) {
                  if (loading) {
                      logd("Já estou carregando…")
                      return
                  }
                  loading = true
                  ready = false
                  val m = curModel()
                  val f = modelFile(m)
                  setState(St.IDLE)
                  setStatus("Carregando " + m.label + "… (pode levar até 1 minuto)")
                  scope.launch {
                      try {
                          releaseEngine()
                          var be = gs(beKey(m), "")
                          if (be.isEmpty() || forceBench) {
                              be = benchmark(m, f)
                              prefs.edit().putString(beKey(m), be).apply()
                          }
                          var ok = startEngine(m, f, be)
                          if (!ok) {
                              val other = if (be == "gpu") "cpu" else "gpu"
                              if (!(other == "gpu" && gb("bad_gpu", false))) {
                                  logd("Falhou com " + be + "; tentando " + other)
                                  ok = startEngine(m, f, other)
                                  if (ok) prefs.edit().putString(beKey(m), other).apply()
                              }
                          }
                          if (!ok) {
                              if (isHeavy(m.id)) {
                                  ui.postDelayed({ switchToQwen("o modelo " + m.label + " não conseguiu iniciar", true) }, 500)
                              } else {
                                  setStatus("Não consegui iniciar o modelo. Abra o Log e copie o texto.")
                              }
                          } else {
                              ready = true
                              logd("PRONTO. " + memInfo())
                              setStep("pronto")
                              runOnUiThread {
                                  setState(St.IDLE)
                                  maybeGreet()
                              }
                          }
                      } catch (t: Throwable) {
                          logd("loadModel erro: " + t.javaClass.simpleName + ": " + t.message)
                      } finally {
                          loading = false
                      }
                  }
              }

              private suspend fun benchmark(m: ModelInfo, f: File): String {
                  setStep("Teste de GPU/CPU (só na primeira vez; pode levar 1 a 2 minutos)")
                  setStatus("Testando GPU e CPU… só na primeira vez.")
                  val res = HashMap<String, Double>()
                  for (be in listOf("gpu", "cpu")) {
                      if (be == "gpu" && gb("bad_gpu", false)) {
                          logd("GPU marcada como instável; pulando o teste dela.")
                          continue
                      }
                      prefs.edit().putString("pending_be", be).commit()
                      var tps = -1.0
                      try {
                          tps = testBackend(m, f, be)
                      } catch (t: Throwable) {
                          logd("Teste " + be + " falhou: " + t.javaClass.simpleName + ": " + t.message)
                      }
                      prefs.edit().putString("pending_be", "").commit()
                      logd("Teste " + be + ": " + (if (tps > 0) String.format(Locale.US, "%.1f ~tok/s", tps) else "falhou"))
                      if (tps > 0) res[be] = tps
                  }
                  val g = res["gpu"]
                  val c = res["cpu"]
                  val best = if (g != null && (c == null || g > c * 1.15)) "gpu" else "cpu"
                  logd("Escolhido: " + best)
                  return best
              }

              private suspend fun testBackend(m: ModelInfo, f: File, be: String): Double {
                  val e = Engine(makeConfig(m, f, be))
                  try {
                      val ti = System.nanoTime()
                      e.initialize()
                      val t0 = System.nanoTime()
                      logd("  " + be + ": carregou em " + ((t0 - ti) / 1_000_000L) + " ms | " + memInfo())
                      val c = e.createConversation()
                      var chars = 0
                      c.sendMessageAsync("Conte de um a dez, por extenso, em português.").collect { msg ->
                          chars += msg.toString().length
                      }
                      val t1 = System.nanoTime()
                      c.close()
                      val secs = (t1 - t0) / 1e9
                      logd("  " + be + ": resposta de " + chars + " caracteres em " + String.format(Locale.US, "%.1f", secs) + " s")
                      return if (chars < 5 || secs <= 0.0) -1.0 else (chars / 3.2) / secs
                  } finally {
                      try {
                          e.close()
                      } catch (t: Throwable) {
                      }
                  }
              }

              private suspend fun startEngine(m: ModelInfo, f: File, be: String): Boolean {
                  prefs.edit().putString("pending_be", be).commit()
                  try {
                      setStep("Carregando " + m.label + " (" + be + ")")
                      val t0 = System.currentTimeMillis()
                      val e = Engine(makeConfig(m, f, be))
                      e.initialize()
                      engine = e
                      engineModel = m.id
                      curBackend = be
                      conversation = null
                      logd("Motor iniciado em " + (System.currentTimeMillis() - t0) + " ms (" + m.label + ", " + be + ")")
                      return true
                  } catch (t: Throwable) {
                      logd("Falha ao iniciar " + m.label + " em " + be + ": " + t.javaClass.simpleName + ": " + t.message)
                      return false
                  } finally {
                      prefs.edit().putString("pending_be", "").commit()
                  }
              }

              private fun getConversation(extra: Int): Conversation {
                  val old = conversation
                  if (old != null && turns < 12 && convChars + extra < 7000 && !resetPending) return old
                  try {
                      old?.close()
                  } catch (t: Throwable) {
                  }
                  conversation = null
                  resetPending = false
                  val e = engine ?: throw IllegalStateException("motor não iniciado")
                  val hist = ArrayList<Pair<Boolean, String>>()
                  for (h in loadHistory().takeLast(8)) {
                      if (hist.isEmpty() && !h.first) continue
                      if (hist.isNotEmpty() && hist[hist.size - 1].first == h.first) hist.removeAt(hist.size - 1)
                      hist.add(h)
                  }
                  if (hist.isNotEmpty() && hist[hist.size - 1].first) hist.removeAt(hist.size - 1)
                  val initMsgs = ArrayList<Message>()
                  var histChars = 0
                  for (h in hist) {
                      histChars += h.second.length
                      if (h.first) initMsgs.add(Message.user(h.second)) else initMsgs.add(Message.model(h.second))
                  }
                  turns = 0
                  val llama = engineModel == "llama"
                  val sampler = SamplerConfig(topK = 40, topP = 0.95, temperature = if (llama) 0.5 else 0.7)
                  val sysText = buildSystemPrompt()
                  val sys = Contents.of(sysText)
                  convChars = sysText.length + histChars
                  var conv: Conversation
                  if (llama) {
                      try {
                          conv = e.createConversation(ConversationConfig(
                              systemInstruction = sys,
                              initialMessages = initMsgs,
                              samplerConfig = sampler,
                              maxOutputToken = 400
                          ))
                      } catch (t: Throwable) {
                          logd("Conversa com limite de saída falhou (" + t.message + "); tentando sem.")
                          conv = e.createConversation(ConversationConfig(
                              systemInstruction = sys,
                              initialMessages = initMsgs,
                              samplerConfig = sampler
                          ))
                      }
                  } else {
                      try {
                          conv = e.createConversation(ConversationConfig(
                              systemInstruction = sys,
                              initialMessages = initMsgs,
                              samplerConfig = sampler,
                              thinkingConfig = ThinkingConfig(enableThinking = false, thinkingTokenBudget = 0),
                              maxOutputToken = 400
                          ))
                      } catch (t: Throwable) {
                          logd("Conversa com 'thinking' falhou (" + t.message + "); tentando sem.")
                          conv = e.createConversation(ConversationConfig(
                              systemInstruction = sys,
                              initialMessages = initMsgs,
                              samplerConfig = sampler
                          ))
                      }
                  }
                  conversation = conv
                  logd("Nova conversa criada (histórico: " + initMsgs.size + " msgs, ~" + convChars + " caracteres)")
                  return conv
              }

              private fun ask(text: String) {
                  if (!ready) {
                      reply("O modelo ainda está carregando. Só um instante.")
                      return
                  }
                  busy = true
                  speakOn = true
                  genDone = false
                  setState(St.THINKING)
                  val tStart = System.currentTimeMillis()
                  scope.launch {
                      var prompt = text
                      var directMsg: String? = null
                      val mode = if (gb("web", true)) JarvisWeb.decide(JarvisWeb.norm(text), JarvisWeb.norm(assistantName())) else WebMode.NONE
                      if (mode != WebMode.NONE) {
                          val strict = mode == WebMode.WEATHER || mode == WebMode.NEWS
                          if (!isOnline()) {
                              logd("Sem internet; pesquisa ignorada (" + mode + ")")
                              if (strict) directMsg = "Estou sem conexão com a internet agora, então não consigo consultar isso."
                              else prompt = NO_WEB_NOTE + text
                          } else {
                              setStatus("Pesquisando na internet…")
                              logd("Pesquisa web [" + mode + "]: " + text)
                              val t0 = System.currentTimeMillis()
                              var ctx: WebCtx? = null
                              try {
                                  ctx = JarvisWeb.fetch(mode, text, gs("city", "")) { m -> logd(m) }
                              } catch (t: TimeoutCancellationException) {
                                  logd("Pesquisa demorou demais.")
                              } catch (t: CancellationException) {
                                  throw t
                              } catch (t: Throwable) {
                                  logd("Pesquisa falhou: " + t.javaClass.simpleName + ": " + t.message)
                              }
                              val c = ctx
                              logd("Pesquisa terminou em " + (System.currentTimeMillis() - t0) + " ms | " +
                                  (if (c != null) c.text.length.toString() + " caracteres" else "sem resultado"))
                              if (c != null) {
                                  prompt = JarvisWeb.wrap(c, text, mode, nowStr())
                                  val city = c.city
                                  if (city != null) prefs.edit().putString("city", city).apply()
                              } else if (strict) {
                                  directMsg = "Não consegui buscar essa informação na internet agora."
                              } else {
                                  prompt = NO_WEB_NOTE + text
                              }
                              setStatus("Pensando…")
                          }
                      }
                      val dm = directMsg
                      if (dm != null) {
                          runOnUiThread { reply(dm) }
                          return@launch
                      }
                      val raw = StringBuilder()
                      val sbuf = StringBuilder()
                      var shown = ""
                      var chars = 0
                      var failed: Throwable? = null
                      try {
                          val conv = getConversation(prompt.length)
                          conv.sendMessageAsync(prompt).collect { m ->
                              raw.append(m.toString())
                              val vis = visibleText(raw.toString())
                              if (vis.length > shown.length && vis.startsWith(shown)) {
                                  val d = vis.substring(shown.length)
                                  shown = vis
                                  chars += d.length
                                  sbuf.append(d)
                                  val sents = extractSentences(sbuf, false)
                                  val snap = shown
                                  runOnUiThread {
                                      setReplyText(snap)
                                      for (s in sents) speakSentence(s)
                                  }
                              }
                          }
                      } catch (t: Throwable) {
                          failed = t
                      }
                      val rest = extractSentences(sbuf, true)
                      val secs = (System.currentTimeMillis() - tStart) / 1000.0
                      val fl = failed
                      if (fl != null) {
                          logd("Erro ao gerar: " + fl.javaClass.simpleName + ": " + fl.message)
                          try {
                              conversation?.close()
                          } catch (t: Throwable) {
                          }
                          conversation = null
                          prefs.edit().remove("hist").apply()
                          logd("Histórico salvo descartado para a próxima tentativa começar limpa.")
                      } else {
                          turns++
                          convChars += prompt.length + shown.length
                          lastTps = (chars / 3.2) / max(secs, 0.1)
                          if (shown.isNotBlank()) addHistory(text, shown)
                      }
                      val finalText = shown
                      runOnUiThread {
                          genDone = true
                          if (finalText.isBlank()) {
                              reply(if (fl != null) "Tive um problema ao pensar. Veja o log de diagnóstico." else "Desculpe, não consegui formular uma resposta.")
                          } else {
                              commitReply(finalText)
                              for (s in rest) speakSentence(s)
                              logd("Resposta: " + chars + " caracteres em " + String.format(Locale.US, "%.1f", secs) +
                                  " s (~" + String.format(Locale.US, "%.1f", lastTps) + " tok/s) | " + memInfo())
                              healthCheck()
                              if (ttsPending == 0) finishTurn()
                          }
                      }
                  }
              }

              private fun healthCheck() {
                  if (!isHeavy(engineModel)) return
                  val th = thermal()
                  val av = availMb()
                  if (th >= 3) switchToQwen("o celular está esquentando demais")
                  else if (av < 500) switchToQwen("a memória está acabando")
              }

              private fun switchToQwen(reason: String, persist: Boolean = false) {
                  if (curModel().id == "qwen") {
                      setStatus("Problema: " + reason + ". Veja o Log.")
                      return
                  }
                  val q = MODELS.first { it.id == "qwen" }
                  if (persist) prefs.edit().putString("model", "qwen").apply() else tempModel = "qwen"
                  logd("TROCA AUTOMÁTICA para " + q.label + ": " + reason + (if (persist) "" else " (só nesta sessão)"))
                  toast("Troquei para o modelo leve (" + q.label + "): " + reason)
                  notice = "Troquei para o modelo leve, porque " + reason + ". Você pode voltar ao modelo maior nos ajustes."
                  if (hasModel(q)) loadModel() else offerDownload(q)
              }

              private fun beKey(m: ModelInfo): String = "backend_" + m.id

              private fun nowStr(): String =
                  SimpleDateFormat("EEEE, d 'de' MMMM 'de' yyyy, HH:mm", Locale("pt", "BR")).format(Date())

              private fun isOnline(): Boolean {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return false
                  val nc = cm.getNetworkCapabilities(net) ?: return false
                  return nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }

              private fun isWifi(): Boolean {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return false
                  val nc = cm.getNetworkCapabilities(net) ?: return false
                  return nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) || nc.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)
              }

              private fun offerDownload(mi: ModelInfo) {
                  runOnUiThread {
                      val wifi = isWifi()
                      val msg = "Preciso baixar o modelo " + mi.label + " (cerca de " + fmtBytes(mi.approx) +
                          ") uma única vez. Depois o app funciona sem internet.\n\n" +
                          (if (wifi) "Você está no Wi-Fi. Ótimo." else "ATENÇÃO: você NÃO está no Wi-Fi. Recomendo conectar ao Wi-Fi para não gastar seus dados móveis.") +
                          "\n\nMantenha o app aberto durante o download. Se cair, toque em 'Retomar' e ele continua de onde parou."
                      val b = AlertDialog.Builder(this)
                      b.setTitle("Baixar modelo de IA")
                      b.setMessage(msg)
                      b.setCancelable(false)
                      b.setPositiveButton(if (wifi) "Baixar agora" else "Baixar mesmo assim") { _, _ -> startDownload(mi) }
                      b.setNegativeButton("Agora não") { _, _ ->
                          setStatus("Modelo não baixado. Ajustes > Baixar / conferir modelo.")
                      }
                      b.show()
                  }
              }

              private fun startDownload(mi: ModelInfo) {
                  if (downloading) return
                  downloading = true
                  dlModel = mi
                  runOnUiThread {
                      progressBox.visibility = View.VISIBLE
                      retryBtn.visibility = View.GONE
                      progressBar.progress = 0
                      progressTv.text = "Preparando download de " + mi.label + "…"
                  }
                  setStep("Baixando " + mi.label)
                  scope.launch {
                      var ok = false
                      var attempt = 0
                      var fatal: String? = null
                      while (!ok && attempt < 8 && fatal == null) {
                          attempt++
                          try {
                              ok = downloadOnce(mi)
                          } catch (t: FatalDl) {
                              fatal = t.message ?: "erro"
                          } catch (t: Throwable) {
                              logd("Download: " + t.javaClass.simpleName + ": " + t.message + " (tentativa " + attempt + ")")
                              runOnUiThread { progressTv.text = "Conexão instável, tentando de novo (" + attempt + ")…" }
                              delay(3000L * attempt)
                          }
                      }
                      val fm = fatal
                      runOnUiThread {
                          downloading = false
                          if (ok) {
                              progressBox.visibility = View.GONE
                              toast("Download concluído!")
                              loadModel()
                          } else {
                              progressTv.text = if (fm != null) "Erro: " + fm else "Download interrompido. Toque em Retomar (continua de onde parou)."
                              retryBtn.visibility = View.VISIBLE
                              logd("Download parou. " + (fm ?: "sem conexão estável"))
                          }
                      }
                  }
              }

              private fun showProgress(mi: ModelInfo, have: Long, total: Long, speed: Double) {
                  runOnUiThread {
                      progressBar.progress = if (total > 0) (have * 1000L / total).toInt() else 0
                      progressTv.text = "Baixando " + mi.label + ": " + (have * 100L / max(total, 1L)) + "% — " +
                          fmtBytes(have) + " de " + fmtBytes(total) + " — " + String.format(Locale.US, "%.1f", speed / 1e6) + " MB/s"
                  }
              }

              private fun downloadOnce(mi: ModelInfo): Boolean {
                  val dir = File(filesDir, "models")
                  dir.mkdirs()
                  val part = File(dir, mi.file + ".part")
                  val dest = File(dir, mi.file)
                  var have = if (part.exists()) part.length() else 0L
                  var url = mi.url
                  var conn: HttpURLConnection? = null
                  var hops = 0
                  while (conn == null) {
                      val cc = URL(url).openConnection() as HttpURLConnection
                      cc.instanceFollowRedirects = false
                      cc.connectTimeout = 20000
                      cc.readTimeout = 30000
                      cc.setRequestProperty("User-Agent", "JarvisLocal/1.0")
                      if (have > 0) cc.setRequestProperty("Range", "bytes=" + have + "-")
                      val rc = cc.responseCode
                      if (rc in 300..399) {
                          val loc = cc.getHeaderField("Location") ?: throw RuntimeException("redirecionamento sem destino")
                          url = URL(URL(url), loc).toString()
                          cc.disconnect()
                          hops++
                          if (hops > 6) throw RuntimeException("redirecionamentos demais")
                      } else {
                          conn = cc
                      }
                  }
                  val c: HttpURLConnection = conn
                  val code = c.responseCode
                  if (code == 401 || code == 403) {
                      throw FatalDl("HTTP " + code + ": acesso negado. O modelo pode exigir login/licença no Hugging Face.")
                  }
                  if (code == 416) {
                      part.delete()
                      throw RuntimeException("HTTP 416: reiniciando do zero")
                  }
                  if (code != 200 && code != 206) throw RuntimeException("HTTP " + code)
                  var total: Long
                  if (code == 206) {
                      val cr = c.getHeaderField("Content-Range")
                      total = cr?.substringAfter('/')?.toLongOrNull() ?: (have + c.contentLengthLong)
                  } else {
                      have = 0L
                      part.delete()
                      total = c.contentLengthLong
                  }
                  if (total <= 0L) total = mi.approx
                  val need = total - have
                  if (filesDir.usableSpace < need + 200_000_000L) {
                      throw FatalDl("Sem espaço: precisa de " + fmtBytes(need) + " livres no celular.")
                  }
                  logd("Download " + mi.label + ": retomando em " + fmtBytes(have) + " de " + fmtBytes(total))
                  val raf = RandomAccessFile(part, "rw")
                  try {
                      raf.seek(have)
                      val buf = ByteArray(256 * 1024)
                      val ins = c.inputStream
                      try {
                          var lastUi = 0L
                          var lastBytes = have
                          var lastT = System.currentTimeMillis()
                          while (true) {
                              val n = ins.read(buf)
                              if (n < 0) break
                              raf.write(buf, 0, n)
                              have += n.toLong()
                              val now = System.currentTimeMillis()
                              if (now - lastUi > 500) {
                                  val speed = (have - lastBytes) * 1000.0 / max(now - lastT, 1L)
                                  showProgress(mi, have, total, speed)
                                  lastUi = now
                                  lastBytes = have
                                  lastT = now
                              }
                          }
                      } finally {
                          ins.close()
                      }
                  } finally {
                      raf.close()
                  }
                  c.disconnect()
                  if (have < total) throw RuntimeException("conexão caiu em " + fmtBytes(have))
                  dest.delete()
                  if (!part.renameTo(dest)) throw FatalDl("Não consegui salvar o arquivo do modelo.")
                  logd("Download concluído: " + fmtBytes(dest.length()))
                  return true
              }
          }
          JVEOF

          echo "Arquivos criados:"
          find jarvis -type f | sort

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar o APK
        working-directory: jarvis
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build.log 2>&1
          code=$?
          echo "gradle terminou com codigo $code"
          if [ $code -ne 0 ]; then
            echo "=============== RESUMO DOS ERROS ==============="
            grep -E "^e: |What went wrong|Execution failed|Could not|requires|incompatible|Caused by|error:" -A4 build.log | head -n 70
            echo "------ ultimas linhas ------"
            tail -n 25 build.log
            echo "================================================"
          else
            grep -i litertlm build.log | head -n 3 || true
          fi
          exit $code

      - name: Preparar o APK
        run: |
          mkdir -p out
          cp jarvis/app/build/outputs/apk/debug/app-debug.apk out/Jarvis-Local-${{ github.run_number }}.apk
          ls -la out

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Local-APK
          path: out/*.apk

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis Local build ${{ github.run_number }}
          files: out/*.apk
