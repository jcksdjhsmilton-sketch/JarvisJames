              // estado
              @Volatile private var state = St.IDLE
              private val logBuf = StringBuilder()
              private val convoBase = StringBuilder()
              private var step = "iniciando"
              private var lastTps = 0.0
              private var curBackend = "-"
              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var engineModel = ""
              @Volatile private var ready = false
              @Volatile private var loading = false
              private var turns = 0
              private var busy = false
              private var downloading = false
              private var dlModel: ModelInfo? = null
              private var greeted = false
              private var notice = ""
              private var resetPending = false
              private var lastVoice = false
              private var pendingAction: (() -> Unit)? = null
              private var pendingDialog: AlertDialog? = null
              private var torchOn = false

              // voz
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var ttsInit = false
              private var ttsPending = 0
              private var ttsEpoch = 0
              private var utt = 0
              private var speakOn = true
              private var genDone = true
              private var recognizer: SpeechRecognizer? = null
              private var offlineOk: Boolean? = null
              private var noSpeechCount = 0

              // ---------- util ----------
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun gs(k: String, d: String): String = prefs.getString(k, d) ?: d
              private fun gb(k: String, d: Boolean): Boolean = prefs.getBoolean(k, d)
              private fun gf(k: String, d: Float): Float = prefs.getFloat(k, d)
              private fun assistantName(): String = gs("name", "Jarvis")
              private fun curModel(): ModelInfo = MODELS.firstOrNull { it.id == gs("model", "gemma") } ?: MODELS[0]
              private fun modelFile(m: ModelInfo): File = File(File(filesDir, "models"), m.file)
              private fun hasModel(m: ModelInfo): Boolean {
                  val f = modelFile(m)
                  return f.exists() && f.length() > 100_000_000L
              }
              private fun fmtBytes(b: Long): String =
                  if (b >= 1_000_000_000L) String.format(Locale.US, "%.2f GB", b / 1e9) else (b / 1_000_000L).toString() + " MB"
              private fun toast(m: String) {
                  runOnUiThread { Toast.makeText(this, m, Toast.LENGTH_LONG).show() }
              }
              private fun logd(m: String) {
                  android.util.Log.d("JARVIS", m)
                  val line = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date()) + "  " + m + "\n"
                  runOnUiThread {
                      logBuf.append(line)
                      if (logBuf.length > 60000) logBuf.delete(0, logBuf.length - 50000)
                      if (::logPanel.isInitialized && logPanel.visibility == View.VISIBLE) {
                          logTv.text = logBuf.toString()
                      }
                  }
              }
              private fun setStep(s: String) {
                  step = s
                  logd("Etapa: " + s)
                  refreshDiag()
              }
              private fun setStatus(s: String) {
                  runOnUiThread { if (::statusTv.isInitialized) statusTv.text = s }
              }
              private fun thermal(): Int =
                  if (Build.VERSION.SDK_INT >= 29) (getSystemService(Context.POWER_SERVICE) as PowerManager).currentThermalStatus else 0
              private fun availMb(): Long {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  return mi.availMem / 1048576L
              }
              private fun memInfo(): String {
                  val dm = Debug.MemoryInfo()
                  Debug.getMemoryInfo(dm)
                  return "RAM livre " + availMb() + " MB | app " + (dm.totalPss / 1024) + " MB | térmico " + thermal()
              }
              private fun refreshDiag() {
                  runOnUiThread {
                      if (!::diagTv.isInitialized) return@runOnUiThread
                      diagTv.text = "Etapa: " + step + "\n~tok/s: " + String.format(Locale.US, "%.1f", lastTps) +
                          " | " + memInfo() + "\nModelo: " + engineModel + " / " + curBackend
                      voiceTv.text = when (offlineOk) {
                          true -> "Voz: reconhecimento OFFLINE disponível"
                          false -> "Voz: pacote offline pt-BR NÃO instalado. Usando ONLINE (áudio vai ao Google)"
                          null -> "Voz: modo offline preferido (não consegui verificar)"
                      }
                  }
              }
              private val diagRunnable = object : Runnable {
                  override fun run() {
                      refreshDiag()
                      ui.postDelayed(this, 3000)
                  }
              }
              private fun norm(s: String): String {
                  val d = Normalizer.normalize(s.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                  return d.replace(Regex("\\p{M}+"), "").replace(Regex("[^a-z0-9: ]"), " ").replace(Regex("\\s+"), " ").trim()
              }

              // ---------- ciclo de vida ----------
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("jarvis", MODE_PRIVATE)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val old = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try {
                          prefs.edit().putString("last_crash", android.util.Log.getStackTraceString(e).take(3500)).commit()
                      } catch (x: Throwable) {
                      }
                      old?.uncaughtException(t, e)
             
