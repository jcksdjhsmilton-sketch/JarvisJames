                  } catch (t: Throwable) {
                  }
                  if (state == St.LISTENING) setState(St.IDLE)
                  stopSpeaking()
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  scope.cancel()
                  try {
                      recognizer?.destroy()
                  } catch (t: Throwable) {
                  }
                  tts?.shutdown()
                  releaseEngine()
                  super.onDestroy()
              }

