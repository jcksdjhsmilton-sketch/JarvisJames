              private fun saveSettings() {
                  val newName = nameEt.text.toString().trim().ifEmpty { "Jarvis" }
                  val rate = 0.5f + rateSb.progress / 100f
                  val oldModel = gs("model", "llama")
                  val newModel = MODELS[max(0, modelRg.checkedRadioButtonId - 1000)].id
                  val hadTemp = tempModel
                  tempModel = null
                  prefs.edit()
                      .putString("name", newName)
                      .putFloat("rate", rate)
                      .putBoolean("cont", contSw.isChecked)
                      .putBoolean("wake", wakeSw.isChecked)
                      .putBoolean("web", webSw.isChecked)
                      .putString("persona", personaEt.text.toString().ifBlank { DEFAULT_PERSONA })
                      .putString("model", newModel)
                      .apply()
                  titleTv.text = newName
                  tts?.setSpeechRate(rate)
                  resetPending = true
                  showSettings(false)
                  if (newModel != oldModel || (hadTemp != null && hadTemp != newModel)) loadModelOrOffer()
              }

