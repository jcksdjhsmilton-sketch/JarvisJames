                  else if (settingsPanel.visibility == View.VISIBLE) showSettings(false)
                  else super.onBackPressed()
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.action == MotionEvent.ACTION_DOWN) stopSpeaking()
                  return super.dispatchTouchEvent(ev)
              }

              private fun reportPreviousExit() {
                  val lc = gs("last_crash", "")
                  if (lc.isNotEmpty()) {
                      logd("ÚLTIMO ERRO (Java):\n" + lc)
                      prefs.edit().remove("last_crash").apply()
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          for (i in am.getHistoricalProcessExitReasons(packageName, 0, 3)) {
                              logd("Saída anterior: " + exitName(i.reason) + " | " + i.description + " | há " +
                                  ((System.currentTimeMillis() - i.timestamp) / 60000L) + " min")
                          }
                      } catch (t: Throwable) {
                          logd("exit info: " + t.message)
                      }
                  }
              }

              private fun exitName(r: Int): String = when (r) {
                  1 -> "EXIT_SELF"
                  2 -> "SIGNALED"
                  3 -> "LOW_MEMORY (faltou RAM)"
                  4 -> "CRASH"
                  5 -> "CRASH_NATIVE"
                  6 -> "ANR"
                  10 -> "USER_REQUESTED"
                  13 -> "OTHER"
                  else -> "code " + r
              }

              private fun recoverFromNativeCrash() {
                  val pb = gs("pending_be", "")
                  if (pb.isEmpty()) return
                  logd("ATENÇÃO: o app caiu enquanto carregava/testava o motor em '" + pb + "'.")
                  if (pb == "gpu") {
                      prefs.edit().putBoolean("bad_gpu", true).putString(beKey(curModel()), "cpu").putString("pending_be", "").commit()
                      logd("GPU marcada como instável. Vou usar a CPU. (Ajustes > Refazer teste limpa isso.)")
                  } else {
                      prefs.edit().putString("pending_be", "").commit()
                      if (isHeavy(curModel().id)) {
                          val lbl = curModel().label
                          prefs.edit().putString("model", "qwen").commit()
                          notice = "Reiniciei porque o modelo " + lbl + " derrubou o aplicativo. Troquei para o modelo leve Qwen. Você pode tentar o modelo maior de novo nos ajustes."
                          logd(lbl + " derrubou o app na CPU. Troca para Qwen.")
                      }
                  }
              }

