          package br.local.jarvis.tv

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.net.URLDecoder

          // Endereço da TV na rede local (para abrir a página de ajustes pelo celular).
          fun lanIp(): String? {
              try {
                  val ifs = NetworkInterface.getNetworkInterfaces() ?: return null
                  for (ni in ifs) {
                      if (!ni.isUp || ni.isLoopback) continue
                      for (a in ni.inetAddresses) {
                          if (a is Inet4Address && a.isSiteLocalAddress) return a.hostAddress
                      }
                  }
              } catch (t: Throwable) {
              }
              return null
          }

          fun htmlEsc(s: String): String =
              s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;")

          // Mini servidor HTTP que só roda enquanto a tela de Ajustes está aberta.
          // Permite preencher URL/chave/cidade pelo celular (digitar na TV com o controle é ruim).
          // Protegido por um PIN mostrado na TV; os dados só preenchem os campos, quem confirma é a TV.
          class SetupServer(
              private val port: Int,
              private val pin: String,
              private val formHtml: () -> String,
              private val onSave: (Map<String, String>) -> Boolean
          ) {
              @Volatile private var running = false
              private var server: ServerSocket? = null

              fun start(): Boolean {
                  return try {
                      val s = ServerSocket(port)
                      server = s
                      running = true
                      Thread { loop(s) }.start()
                      true
                  } catch (t: Throwable) {
                      false
                  }
              }

              fun stop() {
                  running = false
                  try {
                      server?.close()
                  } catch (t: Throwable) {
                  }
              }

              private fun loop(s: ServerSocket) {
                  while (running) {
                      try {
                          val c = s.accept()
                          try {
                              handle(c)
                          } finally {
                              try {
                                  c.close()
                              } catch (t: Throwable) {
                              }
                          }
                      } catch (t: Throwable) {
                          if (!running) break
                      }
                  }
              }

              private fun handle(c: Socket) {
                  c.soTimeout = 6000
                  val reader = BufferedReader(InputStreamReader(c.getInputStream(), Charsets.ISO_8859_1))
                  val first = reader.readLine() ?: return
                  val parts = first.split(" ")
                  if (parts.size < 2) return
                  val method = parts[0]
                  val path = parts[1]
                  var len = 0
                  while (true) {
                      val line = reader.readLine() ?: break
                      if (line.isEmpty()) break
                      if (line.lowercase().startsWith("content-length:")) {
                          len = line.substring(15).trim().toIntOrNull() ?: 0
                      }
                  }
                  var body = ""
                  if (method == "POST" && len > 0 && len <= 8192) {
                      val buf = CharArray(len)
                      var got = 0
                      while (got < len) {
                          val k = reader.read(buf, got, len - got)
                          if (k < 0) break
                          got += k
                      }
                      body = String(buf, 0, got)
                  }
                  if (method == "POST" && path.startsWith("/save")) {
                      val m = parseForm(body)
                      val ok = m["pin"] == pin && onSave(m)
                      respond(c, if (ok) 200 else 403, page(if (ok) "Enviado para a TV ✓. Agora confirme na TV, em Salvar e conectar." else "PIN incorreto ou dados inválidos. Volte e tente de novo."))
                  } else if (method == "GET") {
                      respond(c, 200, formHtml())
                  } else {
                      respond(c, 405, page("Método não permitido."))
                  }
              }

              private fun parseForm(body: String): Map<String, String> {
                  val out = HashMap<String, String>()
                  for (pair in body.split("&")) {
                      val i = pair.indexOf('=')
                      if (i <= 0) continue
                      try {
                          out[URLDecoder.decode(pair.substring(0, i), "UTF-8")] = URLDecoder.decode(pair.substring(i + 1), "UTF-8")
                      } catch (t: Throwable) {
                      }
                  }
                  return out
              }

              private fun respond(c: Socket, code: Int, html: String) {
                  val bytes = html.toByteArray(Charsets.UTF_8)
                  val status = if (code == 200) "OK" else if (code == 403) "Forbidden" else "Error"
                  val head = "HTTP/1.1 " + code + " " + status + "\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: " +
                      bytes.size + "\r\nConnection: close\r\n\r\n"
                  val os = c.getOutputStream()
                  os.write(head.toByteArray(Charsets.ISO_8859_1))
                  os.write(bytes)
                  os.flush()
              }

              private fun page(msg: String): String =
                  "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
                      "<title>Jarvis TV</title><style>body{font-family:sans-serif;background:#070b14;color:#e0f7ff;padding:24px;font-size:18px}</style></head><body><h2>Jarvis TV</h2><p>" +
                      htmlEsc(msg) + "</p></body></html>"
          }
