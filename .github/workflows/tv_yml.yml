              private val months = arrayOf(
                  "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
              )

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w < 10f || h < 10f) return
                  val now = Calendar.getInstance()
                  val year = now.get(Calendar.YEAR)
                  val month = now.get(Calendar.MONTH)
                  val today = now.get(Calendar.DAY_OF_MONTH)
                  val first = Calendar.getInstance()
                  first.set(year, month, 1)
                  val startDow = first.get(Calendar.DAY_OF_WEEK) - 1
                  val dim = first.getActualMaximum(Calendar.DAY_OF_MONTH)

                  val cellW = w / 7f
                  val titleH = h * 0.14f
                  val wdH = h * 0.11f
                  val rowH = (h - titleH - wdH) / 6f
                  val ts = Math.min(cellW, rowH) * 0.46f

                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.LEFT
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.color = Pal.TEXT
                  p.textSize = titleH * 0.62f
                  canvas.drawText(months[month] + " " + year, 0f, titleH * 0.72f, p)

                  p.textAlign = Paint.Align.CENTER
                  p.textSize = ts * 0.78f
                  for (i in 0..6) {
                      p.color = if (i == 0) Pal.WARN else Pal.MUTED
                      canvas.drawText(wd[i], cellW * (i + 0.5f), titleH + wdH * 0.72f, p)
                  }

                  p.textSize = ts
                  for (d in 1..dim) {
                      val idx = startDow + d - 1
                      val col = idx % 7
                      val row = idx / 7
                      val cx = cellW * (col + 0.5f)
                      val cy = titleH + wdH + rowH * (row + 0.5f)
                      val base = cy - (p.ascent() + p.descent()) / 2f
                      if (d == today) {
                          p.color = Pal.ACCENT
                          canvas.drawCircle(cx, cy, Math.min(cellW, rowH) * 0.42f, p)
                          p.color = Pal.BG
                          p.typeface = Typeface.DEFAULT_BOLD
                      } else {
                          p.color = if (col == 0) Pal.WARN else Pal.TEXT
                          p.typeface = Typeface.DEFAULT
                      }
                      canvas.drawText(d.toString(), cx, base, p)
                  }
              }
          }

          class WeatherData(val label: String, val temp: Int, val feels: Int, val tmin: Int, val tmax: Int, val code: Int, val rain: Int)

          // Temperatura atual da cidade (Open-Meteo, grátis e sem chave).
          object TvWeather {
              private const val UA = "JarvisTV/1.0 (assistente pessoal Android TV)"

              private fun http(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  try {
                      c.connectTimeout = 8000
                      c.readTimeout = 10000
                      c.setRequestProperty("User-Agent", UA)
                      c.setRequestProperty("Accept", "application/json")
                      if (c.responseCode != 200) throw RuntimeException("HTTP " + c.responseCode)
                      return c.inputStream.bufferedReader(Charsets.UTF_8).use { r -> r.readText() }
                  } finally {
                      c.disconnect()
                  }
              }

              fun fetch(city: String): WeatherData? {
                  var lat = 0.0
                  var lon = 0.0
                  var label = ""
                  var ok = false
                  if (city.isNotBlank()) {
                      try {
                          val g = JSONObject(http("https://geocoding-api.open-meteo.com/v1/search?name=" + URLEncoder.encode(city.trim(), "UTF-8") + "&count=1&language=pt&format=json"))
                          val arr = g.optJSONArray("results")
                          if (arr != null && arr.length() > 0) {
                              val o = arr.getJSONObject(0)
                              lat = o.getDouble("latitude")
                              lon = o.getDouble("longitude")
                              label = o.optString("name", city)
                              ok = true
                          }
                      } catch (t: Throwable) {
                      }
                  }
                  if (!ok) {
                      try {
                          val j = JSONObject(http("https://ipwho.is/"))
                          if (j.optBoolean("success", false)) {
                              lat = j.getDouble("latitude")
                              lon = j.getDouble("longitude")
                              label = j.optString("city", "")
                              ok = true
                          }
                      } catch (t: Throwable) {
                      }
                  }
                  if (!ok) return null
                  val url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
                      "&current=temperature_2m,apparent_temperature,weather_code" +
                      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
                      "&timezone=auto&forecast_days=1"
                  val j = JSONObject(http(url))
                  val cur = j.getJSONObject("current")
                  val d = j.getJSONObject("daily")
                  val tmax = d.getJSONArray("temperature_2m_max")
                  val tmin = d.getJSONArray("temperature_2m_min")
                  val pp = d.optJSONArray("precipitation_probability_max")
                  val rain = if (pp != null) pp.optInt(0, -1) else -1
                  return WeatherData(
                      label,
                      Math.round(cur.getDouble("temperature_2m")).toInt(),
                      Math.round(cur.getDouble("apparent_temperature")).toInt(),
                      Math.round(tmin.getDouble(0)).toInt(),
                      Math.round(tmax.getDouble(0)).toInt(),
                      cur.optInt("weather_code", -1),
                      rain
                  )
              }

