              private fun cloudHistory(): List<Pair<Boolean, String>> {
                  val out = ArrayList<Pair<Boolean, String>>()
                  for (h in hist.takeLast(8)) {
                      if (out.isEmpty() && !h.first) continue
                      if (out.isNotEmpty() && out[out.size - 1].first == h.first) out.removeAt(out.size - 1)
                      out.add(h)
                  }
                  if (out.isNotEmpty() && out[out.size - 1].first) out.removeAt(out.size - 1)
                  return out
              }

              // ---------------------------------------------------------------- voz: fala (TTS)

              private fun initTts() {
                  tts = TextToSpeech(this, TextToSpeech.OnInitListener { st ->
                      if (st == TextToSpeech.SUCCESS) {
                          val t = tts
                          if (t != null) {
                              val r = t.setLanguage(Locale("pt", "BR"))
                              ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED
                              t.setSpeechRate(1.0f)
                              t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) setState(St.SPEAKING)
                                      }
                                  }

                                  override fun onDone(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) ttsDone()
                                      }
                                  }

                                  @Deprecated("Deprecated in Java")
                                  override fun onError(utteranceId: String?) {
                                      ui.post {
                                          if (epochOk(utteranceId)) ttsDone()
                                      }
                                  }
                              })
                              if (!ttsReady) {
                                  runOnUiThread { heardTv.text = "Voz em português não encontrada nesta TV (instale o Google Text-to-Speech)." }
                              }
                          }
                      }
                  })
              }

              private fun epochOk(id: String?): Boolean = id != null && id.startsWith("e" + ttsEpoch + "-")

              private fun ttsDone() {
                  if (ttsPending > 0) ttsPending--
                  if (ttsPending == 0 && genDone) finishTurn()
              }

              private fun speakSentence(s: String) {
                  if (!speakOn || !ttsReady) return
                  val c = cleanForSpeech(s)
                  if (c.length < 2) return
                  ttsPending++
                  utt++
                  tts?.speak(c, TextToSpeech.QUEUE_ADD, null, "e" + ttsEpoch + "-" + utt)
              }

              private fun stopSpeaking() {
                  ttsEpoch++
                  try {
                      tts?.stop()
                  } catch (t: Throwable) {
                  }
                  ttsPending = 0
                  speakOn = false
                  if (genDone) finishTurn() else setState(St.THINKING)
              }

              private fun cleanForSpeech(s: String): String {
                  var t = s.replace(Regex("https?://\\S+"), " ")
                  t = t.replace(Regex("(?m)^\\s*[-•*]\\s+"), "")
                  val sb = StringBuilder()
                  var i = 0
                  while (i < t.length) {
                      val cp = t.codePointAt(i)
                      i += Character.charCount(cp)
                      val keep = Character.isLetterOrDigit(cp) || Character.isWhitespace(cp) ||
                          (cp < 128 && ".,;:!?'-()%/+\"".indexOf(cp.toChar()) >= 0) || cp == 0x2026
                      if (keep) sb.appendCodePoint(cp)
                  }
                  return sb.toString().replace(Regex("\\s+"), " ").trim()
              }

              private fun extractSentences(buf: StringBuilder, fin: Boolean): List<String> {
                  val out = ArrayList<String>()
                  while (true) {
                      var cut = -1
                      for (i in 0 until buf.length) {
                          val ch = buf[i]
                          if (ch == '\n') {
                              cut = i
                              break
                          }
                          if (ch == '.' || ch == '!' || ch == '?' || ch == '…') {
                              if (i + 1 < buf.length && buf[i + 1].isWhitespace() && i >= 6) {
                                  cut = i
                                  break
                              }
                              if (fin && i + 1 == buf.length) {
                                  cut = i
                                  break
                              }
                          }
                      }
                      if (cut < 0) break
                      out.add(buf.substring(0, cut + 1))
                      buf.delete(0, cut + 1)
                  }
                  if (fin && buf.isNotBlank()) {
                      out.add(buf.toString())
                      buf.setLength(0)
                  }
                  return out
              }

              private fun reply(text: String) {
                  busy = true
                  speakOn = true
                  genDone = true
                  replyTv.text = text
                  val sb = StringBuilder(text)
                  for (s in extractSentences(sb, true)) speakSentence(s)
                  if (ttsPending == 0) finishTurn()
              }

              private fun finishTurn() {
                  busy = false
                  setState(St.IDLE)
                  if (gb("cont", false) && lastVoice && cloudOk) {
                      ui.postDelayed({
                          if (state == St.IDLE && !busy) startListening()
                      }, 700)
                  }
              }

              // ---------------------------------------------------------------- voz: escuta

              private fun ensureMic(): Boolean {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) return true
                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 11)
                  return false
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 11) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          startListening()
                      } else {
                          heardTv.text = "Sem permissão de microfone. Use ▼ para digitar."
                      }
                  }
              }

              private fun cancelListening() {
                  try {
                      recognizer?.cancel()
                  } catch (t: Throwable) {
                  }
                  orb.level = 0f
                  setState(St.IDLE)
              }

              private fun talk() {
                  if (state == St.LISTENING) {
                      cancelListening()
                      return
                  }
                  if (state == St.SPEAKING) {
                      stopSpeaking()
                  }
                  startListening()
              }

              private fun startListening() {
                  if (state == St.LISTENING) {
                      cancelListening()
                      return
                  }
                  if (!ensureMic()) return
                  if (busy) return
                  if (!cloudOk) {
                      heardTv.text = "Servidor indisponível. Segure OK para abrir os ajustes."
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      heardTv.text = "Reconhecimento de voz indisponível nesta TV. Use ▼ para digitar."
                      return
                  }
                  try {
                      recognizer?.destroy()
                  } catch (t: Throwable) {
                  }
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {
                          orb.level = Math.max(0f, Math.min(1f, (rmsdB + 2f) / 12f))
                      }
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                      override fun onPartialResults(partialResults: Bundle?) {
                          val l = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val p = l?.firstOrNull()
                          if (p != null && p.isNotBlank()) heardTv.text = "“" + p + "”"
                      }
                      override fun onResults(results: Bundle?) {
                          orb.level = 0f
                          val l = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val t = l?.firstOrNull()
                          setState(St.IDLE)
                          if (t == null || t.isBlank()) {
                              onListenFail(7)
                          } else {
                              noSpeechCount = 0
                              onUserText(t, false)
                          }
                      }
                      override fun onError(error: Int) {
                          orb.level = 0f
                          onListenFail(error)
                      }
                  })
                  val ri = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                  ri.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  ri.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  ri.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                  heardTv.text = ""
                  setState(St.LISTENING)
                  r.startListening(ri)
              }

              private fun onListenFail(e: Int) {
                  setState(St.IDLE)
                  if (e == 6 || e == 7) {
                      noSpeechCount++
                      if (gb("cont", false) && noSpeechCount < 3) {
                          ui.postDelayed({
                              if (state == St.IDLE && !busy) startListening()
                          }, 500)
                      } else {
                          noSpeechCount = 0
                          heardTv.text = "Não ouvi nada. Pressione OK para tentar de novo."
                      }
                  } else if (e == 9) {
                      heardTv.text = "Falta permissão de microfone."
                  } else if (e == 12 || e == 13 || e == 2) {
                      heardTv.text = "Voz pt-BR indisponível nesta TV. Use ▼ para digitar."
                  } else if (e != 5) {
                      heardTv.text = "Erro de voz (código " + e + "). Pressione OK ou use ▼ para digitar."
                  }
              }

              // ---------------------------------------------------------------- pergunta -> nuvem

              private fun onUserText(raw: String, typed: Boolean) {
                  val text = raw.trim()
                  if (text.isEmpty()) return
                  lastVoice = !typed
                  heardTv.text = "“" + text + "”"
                  ask(text)
              }

              private fun ask(text: String) {
                  if (!cloudOk) {
                      reply("Não estou conectado ao servidor. Segure o botão OK para abrir os ajustes.")
                      return
                  }
                  busy = true
                  speakOn = true
                  genDone = false
                  visitGen++
                  replyTv.text = ""
                  setState(St.THINKING)
                  val url = gs("url")
                  val key = gs("key")
                  scope.launch {
                      var prompt = text
                      var directMsg: String? = null
                      val mode = if (gb("web", true)) JarvisWeb.decide(JarvisWeb.norm(text), "jarvis") else WebMode.NONE
                      if (mode != WebMode.NONE) {
                          val strict = mode == WebMode.WEATHER || mode == WebMode.NEWS
                          if (!isOnline()) {
                              if (strict) directMsg = "Estou sem conexão com a internet agora, então não consigo consultar isso."
                              else prompt = NO_WEB_NOTE + text
                          } else {
                              runOnUiThread { showSearchPage(mode, text) }
                              var ctx: WebCtx? = null
                              try {
                                  ctx = JarvisWeb.fetch(mode, text, gs("city")) { m -> }
                              } catch (t: TimeoutCancellationException) {
                              } catch (t: CancellationException) {
                                  throw t
                              } catch (t: Throwable) {
                              }
                              val c = ctx
                              if (c != null) {
                                  prompt = JarvisWeb.wrap(c, text, mode, nowStr())
                                  val urls = c.urls
                                  if (urls.isNotEmpty()) runOnUiThread { visitUrls(urls) }
                              } else if (strict) {
                                  directMsg = "Não consegui buscar essa informação na internet agora."
                              } else {
                                  prompt = NO_WEB_NOTE + text
                              }
                          }
                      }
                      val dm = directMsg
                      if (dm != null) {
                          runOnUiThread { reply(dm) }
                          return@launch
                      }
                      val raw = StringBuilder()
                      val sbuf = StringBuilder()
                      var shown = ""
                      var failed: Throwable? = null
                      fun onPiece(piece: String) {
                          raw.append(piece)
                          val vis = raw.toString().trimStart()
                          if (vis.length > shown.length && vis.startsWith(shown)) {
                              val d = vis.substring(shown.length)
                              shown = vis
                              sbuf.append(d)
                              val sents = extractSentences(sbuf, false)
                              val snap = shown
                              runOnUiThread {
                                  replyTv.text = snap
                                  for (s in sents) speakSentence(s)
                              }
                          }
                      }
                      try {
                          val cHist = cloudHistory()
                          val cSys = buildSystemPrompt()
                          withContext(Dispatchers.IO) {
                              JarvisCloud.stream(url, key, cSys, cHist, prompt, 300) { p -> onPiece(p) }
                          }
                      } catch (t: Throwable) {
                          failed = t
                      }
                      val rest = extractSentences(sbuf, true)
                      val fl = failed
                      if (fl == null && shown.isNotBlank()) {
                          hist.add(Pair(true, text))
                          hist.add(Pair(false, shown.take(300)))
                          while (hist.size > 12) hist.removeAt(0)
                      }
                      val finalText = shown
                      runOnUiThread {
                          genDone = true
                          if (finalText.isBlank()) {
                              if (fl != null) {
                                  cloudOk = false
                                  reply("Não consegui falar com o servidor. Verifique se o notebook do Kaggle está rodando.")
                              } else {
                                  reply("Desculpe, não consegui formular uma resposta.")
                              }
                          } else {
                              replyTv.text = finalText
                              for (s in rest) speakSentence(s)
                              if (ttsPending == 0) finishTurn()
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- teclas do controle

              private fun isTalkKey(k: Int): Boolean =
                  k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER || k == KeyEvent.KEYCODE_NUMPAD_ENTER ||
                      k == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE || k == KeyEvent.KEYCODE_MEDIA_PLAY ||
                      k == KeyEvent.KEYCODE_SEARCH || k == KeyEvent.KEYCODE_VOICE_ASSIST || k == KeyEvent.KEYCODE_ASSIST

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (isTalkKey(keyCode)) {
                      event?.startTracking()
                      return true
                  }
                  if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) return true
                  if (keyCode == KeyEvent.KEYCODE_DPAD_UP || keyCode == KeyEvent.KEYCODE_MENU || keyCode == KeyEvent.KEYCODE_SETTINGS) return true
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyLongPress(keyCode: Int, event: KeyEvent?): Boolean {
                  if (isTalkKey(keyCode)) {
                      longHandled = true
                      openSettings()
                      return true
                  }
                  return super.onKeyLongPress(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  if (isTalkKey(keyCode)) {
                      if (longHandled) {
                          longHandled = false
                      } else {
                          talk()
                      }
                      return true
                  }
                  if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) {
                      openTyped()
                      return true
                  }
                  if (keyCode == KeyEvent.KEYCODE_DPAD_UP || keyCode == KeyEvent.KEYCODE_MENU || keyCode == KeyEvent.KEYCODE_SETTINGS) {
                      openSettings()
                      return true
                  }
                  return super.onKeyUp(keyCode, event)
              }

              override fun onBackPressed() {
                  val now = System.currentTimeMillis()
                  if (now - lastBack < 2000) {
                      super.onBackPressed()
                  } else {
                      lastBack = now
                      toast("Pressione Voltar de novo para sair")
                  }
              }

              // ---------------------------------------------------------------- diálogos

              private fun openTyped() {
                  if (settingsDialog != null) return
                  val et = EditText(this)
                  et.hint = "Digite sua pergunta"
                  et.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  et.imeOptions = EditorInfo.IME_ACTION_SEND
                  et.setSingleLine(true)
                  val dlg = AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                      .setTitle("Perguntar ao Jarvis")
                      .setView(et)
                      .setPositiveButton("Perguntar") { _, _ -> submitTyped(et.text.toString()) }
                      .setNegativeButton("Cancelar", null)
                      .create()
                  et.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEND || actionId == EditorInfo.IME_ACTION_DONE) {
                          dlg.dismiss()
                          submitTyped(et.text.toString())
                          true
                      } else {
                          false
                      }
                  }
                  dlg.window?.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE)
                  dlg.show()
              }

              private fun submitTyped(t: String) {
                  val s = t.trim()
                  if (s.isEmpty()) return
                  if (busy) {
                      if (state == St.SPEAKING) stopSpeaking() else return
                  }
                  onUserText(s, true)
              }

              private fun inputField(hint: String, value: String, secret: Boolean): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setText(value)
                  e.setSingleLine(true)
                  e.inputType = if (secret) {
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  } else {
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  }
                  return e
              }

              private fun openSettings() {
                  if (settingsDialog != null) return
                  val pin = (1000 + java.util.Random().nextInt(9000)).toString()
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(u(40), u(16), u(40), u(8))

                  val ip = lanIp()
                  val info = TextView(this)
                  info.setTextSize(TypedValue.COMPLEX_UNIT_PX, u(24).toFloat())
                  info.text = if (ip != null) "Dica: preencha pelo celular. Abra  http://" + ip + ":8765  no navegador e digite o PIN  " + pin + "."
                  else "Conecte a TV ao Wi-Fi para preencher pelo celular."
                  col.addView(info, LinearLayout.LayoutParams(MATCH, WRAP))

                  val urlEt = inputField("URL do servidor (https://xxxx.ngrok-free.dev)", gs("url"), false)
                  val keyEt = inputField("API_KEY", gs("key"), true)
                  val cityEt = inputField("Cidade (para o tempo)", gs("city"), false)
                  val contSw = Switch(this)
                  contSw.text = "Escuta contínua (reabre o microfone após cada resposta)"
                  contSw.isChecked = gb("cont", false)
                  val webSw = Switch(this)
                  webSw.text = "Pesquisar na internet quando precisar"
                  webSw.isChecked = gb("web", true)
                  col.addView(urlEt, vLp(14))
                  col.addView(keyEt, vLp(6))
                  col.addView(cityEt, vLp(6))
                  col.addView(contSw, vLp(14))
                  col.addView(webSw, vLp(8))

                  val sv = ScrollView(this)
                  sv.addView(col)

                  val srv = SetupServer(8765, pin, {
                      "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Jarvis TV</title>" +
                          "<style>body{font-family:sans-serif;background:#070b14;color:#e0f7ff;padding:22px;font-size:18px}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 16px;font-size:18px;border-radius:10px;border:1px solid #1b2a44;background:#0a1220;color:#e0f7ff}" +
                          "button{width:100%;padding:14px;font-size:19px;font-weight:bold;border:0;border-radius:12px;background:#00e5ff;color:#070b14}label{color:#8196ae}</style></head><body>" +
                          "<h2>Jarvis na TV</h2><form method=\"POST\" action=\"/save\">" +
                          "<label>URL do servidor</label><input name=\"url\" value=\"" + htmlEsc(gs("url")) + "\">" +
                          "<label>API_KEY (deixe vazio para manter a atual)</label><input name=\"key\" type=\"password\" autocomplete=\"off\">" +
                          "<label>Cidade</label><input name=\"city\" value=\"" + htmlEsc(gs("city")) + "\">" +
                          "<label>PIN mostrado na TV</label><input name=\"pin\" inputmode=\"numeric\" autocomplete=\"off\">" +
                          "<button type=\"submit\">Enviar para a TV</button></form></body></html>"
                  }, { m ->
                      val url = (m["url"] ?: "").trim()
                      val key = (m["key"] ?: "").trim()
                      val city = (m["city"] ?: "").trim()
                      if (url.isEmpty()) {
                          false
                      } else {
                          runOnUiThread {
                              urlEt.setText(url)
                              if (key.isNotEmpty()) keyEt.setText(key)
                              cityEt.setText(city)
                              toast("Dados recebidos do celular. Confirme em Salvar e conectar.")
                          }
                          true
                      }
                  })
                  if (ip != null && srv.start()) setupServer = srv

                  val dlg = AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                      .setTitle("Ajustes do Jarvis TV")
                      .setView(sv)
                      .setPositiveButton("Salvar e conectar") { _, _ ->
                          prefs.edit()
                              .putString("url", urlEt.text.toString().trim())
                              .putString("key", keyEt.text.toString().trim())
                              .putString("city", cityEt.text.toString().trim())
                              .putBoolean("cont", contSw.isChecked)
                              .putBoolean("web", webSw.isChecked)
                              .apply()
                          connectCloud()
                          loadWeather()
                      }
                      .setNegativeButton("Cancelar", null)
                      .create()
                  dlg.setOnDismissListener {
                      stopSetupServer()
                      settingsDialog = null
                      hideSystemUi()
                  }
                  settingsDialog = dlg
                  dlg.show()
              }

              private fun stopSetupServer() {
                  try {
                      setupServer?.stop()
                  } catch (t: Throwable) {
                  }
                  setupServer = null
              }
          }
          JVEOF

          echo "Arquivos criados:"
          find tv -type f | sort

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar o APK
        working-directory: tv
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build.log 2>&1
          code=$?
          echo "gradle terminou com codigo $code"
          if [ $code -ne 0 ]; then
            echo "=============== RESUMO DOS ERROS ==============="
            grep -E "^e: |What went wrong|Execution failed|Could not|requires|incompatible|Caused by|error:" -A4 build.log | head -n 70
            echo "------ ultimas linhas ------"
            tail -n 25 build.log
            echo "================================================"
          fi
          exit $code

      - name: Preparar o APK
        run: |
          mkdir -p out
          cp tv/app/build/outputs/apk/debug/app-debug.apk out/Jarvis-TV-${{ github.run_number }}.apk
          ls -la out

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-APK
          path: out/*.apk

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: tv-${{ github.run_number }}
          name: Jarvis TV build ${{ github.run_number }}
          files: out/*.apk
