name: Build Jarvis TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Criar o projeto Android inteiro
        run: |
          set -e
          mkdir -p tv/app/src/main/kotlin/br/local/jarvis/tv tv/app/src/main/res/drawable

          cat > tv/settings.gradle.kts <<'JVEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisTV"
          include(":app")
          JVEOF

          cat > tv/build.gradle.kts <<'JVEOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          JVEOF

          cat > tv/gradle.properties <<'JVEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          JVEOF

          cat > tv/app/build.gradle.kts <<'JVEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.local.jarvis.tv"
              compileSdk = 36
              defaultConfig {
                  applicationId = "br.local.jarvis.tv"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          JVEOF

          cat > tv/app/src/main/AndroidManifest.xml <<'JVEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH"/>
                  </intent>
              </queries>
              <application
                  android:label="Jarvis TV"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|smallestScreenSize|uiMode|density|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          JVEOF

          cat > tv/app/src/main/res/drawable/banner.xml <<'JVEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#FF05070D" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#FF0E1A33" android:pathData="M160,90 m-62,0 a62,62 0 1,1 124,0 a62,62 0 1,1 -124,0"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M160,90 m-34,0 a34,34 0 1,1 68,0 a34,34 0 1,1 -68,0"/>
          </vector>
          JVEOF

          cat > tv/app/src/main/res/drawable/ic_launcher.xml <<'JVEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF05070D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FF0E1A33" android:pathData="M54,54 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,54 m-22,0 a22,22 0 1,1 44,0 a22,22 0 1,1 -44,0"/>
          </vector>
          JVEOF

          cat > tv/app/src/main/kotlin/br/local/jarvis/tv/Net.kt <<'JVEOF'
          package br.local.jarvis.tv

          import android.text.Html
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLDecoder
          import java.net.URLEncoder
          import java.text.Normalizer
          import java.util.Locale

          enum class WebMode { NONE, GENERAL, NEWS, WEATHER }

          class WebHit(val title: String, val snippet: String, val source: String, val url: String = "")

          class WebCtx(val text: String, val city: String?, val urls: List<String> = emptyList())

          const val NO_WEB_NOTE = "[Nota: sem acesso à internet neste momento. Responda com o que você sabe e avise se algo puder estar desatualizado.] "

          // Pesquisa na internet 100% gratuita e sem chave de API:
          // DuckDuckGo (HTML) -> Bing (HTML) -> Wikipédia, Google Notícias (RSS) e Open-Meteo (clima).
          object JarvisWeb {
              private const val UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
              private const val API_UA = "JarvisLocal/2.0 (assistente pessoal Android)"
              private const val MAX_CHARS = 2200

              fun norm(s: String): String {
                  val d = Normalizer.normalize(s.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                  return d.replace(Regex("\\p{M}+"), "").replace(Regex("[^a-z0-9: ]"), " ").replace(Regex("\\s+"), " ").trim()
              }

              private val chitRe = Regex("^(?:(?:oi|ola|opa|e ai|bom dia|boa tarde|boa noite|tudo bem|tudo bom|obrigado|obrigada|valeu|tchau|ate logo|como voce esta|como vai|como voce vai|quem e voce|qual e o seu nome|qual o seu nome|qual seu nome|o que voce faz|o que voce pode fazer|voce esta ai|me ajuda|ajuda)\\s*)+\$")
              private val weatherRe = Regex("\\b(?:clima|previsao do tempo|vai chover|esta chovendo|ta chovendo|quantos graus|temperatura (?:hoje|agora|amanha|atual|la fora|aqui|em)|faz (?:calor|frio)|esta (?:frio|calor)|o tempo (?:hoje|amanha|agora|em|na|no|la fora|aqui|vai)|como (?:esta|ta|vai estar|vai ficar) o tempo)\\b|qual (?:e )?a temperatura(?: agora| hoje| la fora| aqui| atual)?\$")
              private val newsRe = Regex("\\b(?:noticias?|manchetes?|o que esta acontecendo)\\b")
              private val explicitRe = Regex("\\b(?:pesquis\\w*|procur\\w*|busqu\\w*|buscar|google|na internet|na web)\\b")
              private val noWebRe = Regex("\\b(?:traduz\\w*|escreva|escrever|crie|criar|invente|resum\\w*|reescrev\\w*|corrij\\w*|conte (?:uma|um)|piada|poema|poesia|calcul\\w*|finja|imagine|quanto e \\d|\\d+ (?:mais|menos|vezes|dividido))\\b")
              private val leadRe = Regex("^(?:voce )?(?:sabe|conhece|poderia|pode|consegue)(?: me)?(?: dizer| falar| informar)? ")
              private val selfRe = Regex("\\b(?:voce|seu|sua|seus|suas|te)\\b")
              private val timeRe = Regex("\\b(?:ultimas?|ultimos?|recentes?|esta semana|essa semana|este mes|esse mes|este ano|esse ano|20(?:2[3-9]|3[0-9])|dolar|euro|bitcoin|cotacao|ibovespa|selic|inflacao|placar|campeonato|quem ganhou|quanto custa|quanto esta|preco|lancamento|lancou|estreia|em cartaz|presidente|governador|prefeito)\\b")
              private val factRe = Regex("^(?:quem|quando|onde|qual|quais|quanto|quantos|quantas|quanta|por que|porque|o que|oque|que dia|que ano|como (?:fazer|faz|se faz|funciona|instalar|resolver|chegar|surgiu|foi|e feito|se escreve)|me (?:fale|diga|explique|conte)|fale sobre|explique|defina|diferenca entre|significado de|capital d)\\b")
              private val defRe = Regex("^(?:quem (?:e|foi|era|sao)|o que (?:e|foi|sao|significa)|me (?:fale|conte) sobre|fale sobre|defina|explique|me explique|capital d|significado de|diferenca entre)\\b")

              // n0 = texto normalizado (sem acento, minúsculo). nameN = nome do assistente normalizado.
              fun decide(n0: String, nameN: String): WebMode {
                  var n = n0
                  if (nameN.length >= 2) n = n.replace(Regex("\\b" + Regex.escape(nameN) + "\\b"), " ")
                  n = n.replace(Regex("\\s+"), " ").trim()
                  if (n.length < 4) return WebMode.NONE
                  if (chitRe.matches(n)) return WebMode.NONE
                  if (weatherRe.containsMatchIn(n)) return WebMode.WEATHER
                  if (newsRe.containsMatchIn(n)) return WebMode.NEWS
                  if (explicitRe.containsMatchIn(n)) return WebMode.GENERAL
                  if (noWebRe.containsMatchIn(n)) return WebMode.NONE
                  val q = leadRe.replace(n, "")
                  if (selfRe.containsMatchIn(q)) return WebMode.NONE
                  if (timeRe.containsMatchIn(q)) return WebMode.GENERAL
                  if (q.split(" ").size >= 3 && factRe.containsMatchIn(q)) return WebMode.GENERAL
                  return WebMode.NONE
              }

              fun cleanQuery(raw: String): String {
                  var q = raw.trim()
                  q = q.replace(Regex("(?i)\\b(?:pesquise|pesquisar|pesquisa|procure|procurar|busque|buscar)\\b(?: na internet| no google| na web| online)?(?: por| sobre| a respeito de)?"), " ")
                  q = q.replace(Regex("(?i)\\b(?:na internet|no google|na web)\\b"), " ")
                  q = q.replace(Regex("(?i)^\\s*(?:por favor|voc[eê] (?:sabe|pode|poderia)(?: me)?(?: dizer)?)\\b,?"), " ")
                  q = q.replace(Regex("[?!]+"), " ").replace(Regex("\\s+"), " ").trim().trim(',', '.', ' ')
                  return if (q.length < 3) raw.trim() else q
              }

              fun newsTopic(raw: String): String {
                  var q = cleanQuery(raw)
                  q = q.replace(Regex("(?i)^(?:quais (?:s[aã]o )?)?(?:me (?:diga|fale|conte) )?(?:as |os )?(?:(?:[uú]ltimas|principais|[uú]ltimos) )?(?:not[ií]cias?|manchetes?)(?: (?:de hoje|do dia|de agora|mais recentes))?(?: (?:sobre|do|da|de|no|na|em))?\\s*"), "")
                  q = q.replace(Regex("(?i)^o que (?:est[aá] acontecendo|aconteceu)(?: (?:no|na|em|com|de|do|da))?\\s*"), "")
                  q = q.replace(Regex("(?i)\\b(?:hoje|agora)\\b"), " ").replace(Regex("\\s+"), " ").trim()
                  return q
              }

              fun cityFrom(raw: String): String {
                  val m = Regex("(?i)\\b(?:em|na|no|para|pra)\\s+([\\p{L}][\\p{L}' .-]{1,40})").find(raw) ?: return ""
                  var c = m.groupValues[1]
                  c = c.replace(Regex("(?i)\\s+(?:hoje|amanh[aã]|agora|neste momento|nesse momento|esta semana|essa semana|este fim de semana|esse fim de semana|fim de semana|depois de amanh[aã]|de noite|de manh[aã]|pela manh[aã]|esta noite|[aà] noite|[aà] tarde)\\b.*\$"), "")
                  c = c.replace(Regex("[?!.,]+\$"), "").trim()
                  val n = norm(c)
                  if (n.length < 3) return ""
                  if (Regex("^(?:minha|meu|nossa|nosso|aqui|casa|cidade|regiao|bairro|segunda|terca|quarta|quinta|sexta|sabado|domingo|semana|dia|noite|manha|tarde|hoje|amanha|agora|momento|geral|brasil)\\b").containsMatchIn(n)) return ""
                  return c
              }

              fun wrap(ctx: WebCtx, question: String, mode: WebMode, now: String): String {
                  val head = when (mode) {
                      WebMode.WEATHER -> "Dados de clima obtidos agora na internet"
                      WebMode.NEWS -> "Manchetes recentes obtidas agora na internet"
                      else -> "Resultados de pesquisa obtidos agora na internet"
                  }
                  val rule = when (mode) {
                      WebMode.WEATHER -> "Responda de forma natural, citando a temperatura atual, a mínima, a máxima e a chance de chuva, em até 3 frases curtas."
                      WebMode.NEWS -> "Resuma as principais manchetes em até 3 frases curtas."
                      else -> "Responda usando as informações acima quando forem relevantes. Se elas não responderem à pergunta, diga que não encontrou e responda com cautela."
                  }
                  return head + " (" + now + "):\n" + ctx.text + "\n" + rule +
                      " Fale em português do Brasil, sem listas, sem markdown e sem links.\nPergunta do usuário: " + question
              }

              suspend fun fetch(mode: WebMode, raw: String, savedCity: String, log: (String) -> Unit): WebCtx? {
                  return withTimeout(16000L) {
                      when (mode) {
                          WebMode.WEATHER -> weatherCtx(raw, savedCity, log)
                          WebMode.NEWS -> newsCtx(raw, log)
                          WebMode.GENERAL -> generalCtx(raw, log)
                          WebMode.NONE -> null
                      }
                  }
              }

              // ---------- rede ----------

              private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8")

              private fun http(url: String, method: String = "GET", body: String? = null, ua: String = UA, accept: String = "*/*"): String {
                  var u = url
                  var m = method
                  var b = body
                  for (hop in 0..5) {
                      val c = URL(u).openConnection() as HttpURLConnection
                      try {
                          c.instanceFollowRedirects = false
                          c.connectTimeout = 7000
                          c.readTimeout = 9000
                          c.requestMethod = m
                          c.setRequestProperty("User-Agent", ua)
                          c.setRequestProperty("Accept", accept)
                          c.setRequestProperty("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.5")
                          val payload = b
                          if (payload != null) {
                              c.doOutput = true
                              c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
                              val bytes = payload.toByteArray(Charsets.UTF_8)
                              c.outputStream.use { os -> os.write(bytes) }
                          }
                          val rc = c.responseCode
                          if (rc in 300..399) {
                              val loc = c.getHeaderField("Location") ?: throw RuntimeException("redirecionamento sem destino")
                              u = URL(URL(u), loc).toString()
                              m = "GET"
                              b = null
                              continue
                          }
                          if (rc != 200) throw RuntimeException("HTTP " + rc)
                          val sb = StringBuilder()
                          val buf = CharArray(8192)
                          c.inputStream.bufferedReader(Charsets.UTF_8).use { r ->
                              while (sb.length < 600000) {
                                  val k = r.read(buf)
                                  if (k < 0) break
                                  sb.append(buf, 0, k)
                              }
                          }
                          return sb.toString()
                      } finally {
                          c.disconnect()
                      }
                  }
                  throw RuntimeException("redirecionamentos demais")
              }

              private fun clean(s: String): String {
                  val noTags = s.replace(Regex("(?is)<script.*?</script>|<style.*?</style>"), " ").replace(Regex("<[^>]*>"), " ")
                  return Html.fromHtml(noTags, Html.FROM_HTML_MODE_LEGACY).toString()
                      .replace("\uFFFC", "").replace('\u00A0', ' ').replace(Regex("\\s+"), " ").trim()
              }

              private fun runSrc(name: String, log: (String) -> Unit, f: () -> List<WebHit>): List<WebHit> {
                  return try {
                      val r = f()
                      log("Pesquisa " + name + ": " + r.size + " resultado(s)")
                      r
                  } catch (t: Throwable) {
                      log("Pesquisa " + name + " falhou: " + t.javaClass.simpleName + ": " + t.message)
                      emptyList()
                  }
              }

              private fun fmt(hits: List<WebHit>, startIdx: Int, snipMax: Int): String {
                  val sb = StringBuilder()
                  var i = startIdx
                  for (h in hits) {
                      i++
                      sb.append(i).append(". ").append(h.title)
                      if (h.snippet.isNotEmpty()) sb.append(": ").append(h.snippet.take(snipMax))
                      if (h.source.isNotEmpty()) sb.append(" (").append(h.source).append(")")
                      sb.append("\n")
                  }
                  return sb.toString()
              }

              // ---------- buscadores ----------

              private fun ddg(q: String): List<WebHit> {
                  val html = http("https://html.duckduckgo.com/html/", "POST", "q=" + enc(q) + "&kl=br-pt", UA, "text/html")
                  val reA = Regex("(<a\\b[^>]*class=\"[^\"]*result__a[^\"]*\"[^>]*>)(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                  val reS = Regex("<a\\b[^>]*class=\"[^\"]*result__snippet[^\"]*\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                  val reH = Regex("href=\"([^\"]*)\"")
                  val ms = reA.findAll(html).toList()
                  val out = ArrayList<WebHit>()
                  for (i in ms.indices) {
                      val m = ms[i]
                      var href = (reH.find(m.groupValues[1])?.groupValues?.get(1) ?: "").replace("&amp;", "&")
                      if (href.contains("duckduckgo.com/y.js") || href.contains("ad_provider") || href.contains("ad_domain")) continue
                      val uddg = Regex("uddg=([^&]+)").find(href)
                      if (uddg != null) {
                          href = try {
                              URLDecoder.decode(uddg.groupValues[1], "UTF-8")
                          } catch (t: Throwable) {
                              href
                          }
                      }
                      if (href.startsWith("//")) href = "https:" + href
                      val endPos = if (i + 1 < ms.size) ms[i + 1].range.first else html.length
                      val startPos = m.range.last + 1
                      val region = if (startPos < endPos) html.substring(startPos, endPos) else ""
                      val sn = reS.find(region)?.let { clean(it.groupValues[1]) } ?: ""
                      val title = clean(m.groupValues[2])
                      if (title.isEmpty()) continue
                      val host = try {
                          URL(href).host.removePrefix("www.")
                      } catch (t: Throwable) {
                          ""
                      }
                      out.add(WebHit(title, sn, host, href))
                      if (out.size >= 6) break
                  }
                  return out
              }

              private fun bing(q: String): List<WebHit> {
                  val html = http("https://www.bing.com/search?q=" + enc(q) + "&setlang=pt-BR&cc=BR", "GET", null, UA, "text/html")
                  val reT = Regex("<h2[^>]*>\\s*<a[^>]*href=\"([^\"]+)\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                  val reP = Regex("<p[^>]*>(.*?)</p>", RegexOption.DOT_MATCHES_ALL)
                  val out = ArrayList<WebHit>()
                  val blocks = html.split("<li class=\"b_algo\"")
                  for (i in 1 until blocks.size) {
                      val b = blocks[i].substringBefore("</li>")
                      val t = reT.find(b)
                      val p = reP.find(b)
                      val title = if (t != null) clean(t.groupValues[2]) else ""
                      val sn = if (p != null) clean(p.groupValues[1]) else ""
                      if (title.isNotEmpty() && sn.isNotEmpty()) out.add(WebHit(title, sn, "Bing", if (t != null) t.groupValues[1].replace("&amp;", "&") else ""))
                      if (out.size >= 6) break
                  }
                  return out
              }

              private fun wiki(q: String): List<WebHit> {
                  val url = "https://pt.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrlimit=3&gsrsearch=" + enc(q) +
                      "&prop=extracts&exintro=1&explaintext=1&exsentences=4&exlimit=3&redirects=1"
                  val j = JSONObject(http(url, "GET", null, API_UA, "application/json"))
                  val pages = j.optJSONObject("query")?.optJSONObject("pages") ?: return emptyList()
                  val tmp = ArrayList<Pair<Int, WebHit>>()
                  val keys = pages.keys()
                  while (keys.hasNext()) {
                      val k = keys.next()
                      val p = pages.getJSONObject(k)
                      val ex = p.optString("extract", "").trim()
                      if (ex.isEmpty()) continue
                      tmp.add(Pair(p.optInt("index", 99), WebHit(p.optString("title", ""), ex.take(700), "Wikipédia", "https://pt.wikipedia.org/wiki/" + enc(p.optString("title", "").replace(' ', '_')))))
                  }
                  tmp.sortBy { it.first }
                  val out = ArrayList<WebHit>()
                  for (p in tmp) out.add(p.second)
                  return out
              }

              private fun tagText(block: String, tag: String): String {
                  val m = Regex("<" + tag + "(?:\\s[^>]*)?>(.*?)</" + tag + ">", RegexOption.DOT_MATCHES_ALL).find(block) ?: return ""
                  return clean(m.groupValues[1].replace("<![CDATA[", "").replace("]]>", ""))
              }

              private fun news(topic: String): List<WebHit> {
                  val url = if (topic.isBlank()) "https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419"
                  else "https://news.google.com/rss/search?q=" + enc(topic) + "&hl=pt-BR&gl=BR&ceid=BR:pt-419"
                  val xml = http(url, "GET", null, API_UA, "application/rss+xml,application/xml,text/xml")
                  val out = ArrayList<WebHit>()
                  val itemRe = Regex("<item>(.*?)</item>", RegexOption.DOT_MATCHES_ALL)
                  for (m in itemRe.findAll(xml)) {
                      val blk = m.groupValues[1]
                      var title = tagText(blk, "title")
                      val src = tagText(blk, "source")
                      val date = tagText(blk, "pubDate").take(16)
                      if (src.isNotEmpty() && title.endsWith(" - " + src)) title = title.removeSuffix(" - " + src)
                      if (title.isNotEmpty()) {
                          val meta = (if (src.isNotEmpty()) src else "") + (if (date.isNotEmpty()) ", " + date else "")
                          out.add(WebHit(title, "", meta, tagText(blk, "link")))
                      }
                      if (out.size >= 6) break
                  }
                  return out
              }

              // ---------- montagem do contexto ----------

              private suspend fun generalCtx(raw: String, log: (String) -> Unit): WebCtx? {
                  val q = cleanQuery(raw)
                  val nq = leadRe.replace(norm(raw), "")
                  val definitional = defRe.containsMatchIn(nq)
                  return coroutineScope {
                      val webD = async(Dispatchers.IO) { runSrc("DuckDuckGo", log) { ddg(q) } }
                      val wikiD = async(Dispatchers.IO) {
                          if (definitional) runSrc("Wikipédia", log) { wiki(q) } else emptyList<WebHit>()
                      }
                      var hits = webD.await()
                      if (hits.isEmpty()) hits = withContext(Dispatchers.IO) { runSrc("Bing", log) { bing(q) } }
                      var wk = wikiD.await()
                      if (hits.isEmpty() && wk.isEmpty() && !definitional) {
                          wk = withContext(Dispatchers.IO) { runSrc("Wikipédia", log) { wiki(q) } }
                      }
                      if (hits.isEmpty() && wk.isEmpty()) {
                          null
                      } else {
                          val sb = StringBuilder()
                          val firstWiki = wk.take(1)
                          sb.append(fmt(firstWiki, 0, 700))
                          sb.append(fmt(hits.take(4), firstWiki.size, 320))
                          val urls = ArrayList<String>()
                                    for (h in firstWiki) if (h.url.isNotEmpty()) urls.add(h.url)
                                    for (h in hits.take(4)) if (h.url.isNotEmpty()) urls.add(h.url)
                                    WebCtx(sb.toString().take(MAX_CHARS), null, urls)
                      }
                  }
              }

              private suspend fun newsCtx(raw: String, log: (String) -> Unit): WebCtx? {
                  val topic = newsTopic(raw)
                  val hits = withContext(Dispatchers.IO) { runSrc("Google Notícias", log) { news(topic) } }
                  if (hits.isEmpty()) return null
                  val head = if (topic.isBlank()) "Principais manchetes do Brasil:\n" else "Manchetes sobre " + topic + ":\n"
                  val urls = ArrayList<String>()
                            for (h in hits.take(3)) if (h.url.isNotEmpty()) urls.add(h.url)
                            return WebCtx((head + fmt(hits.take(5), 0, 0)).take(MAX_CHARS), null, urls)
              }

              private fun wmo(c: Int): String = when (c) {
                  0 -> "céu limpo"
                  1 -> "predominantemente limpo"
                  2 -> "parcialmente nublado"
                  3 -> "nublado"
                  45, 48 -> "neblina"
                  51, 53, 55 -> "garoa"
                  56, 57 -> "garoa congelante"
                  61 -> "chuva fraca"
                  63 -> "chuva moderada"
                  65 -> "chuva forte"
                  66, 67 -> "chuva congelante"
                  71, 73, 75, 77 -> "neve"
                  80 -> "pancadas de chuva fracas"
                  81 -> "pancadas de chuva moderadas"
                  82 -> "pancadas de chuva fortes"
                  85, 86 -> "pancadas de neve"
                  95 -> "tempestade"
                  96, 99 -> "tempestade com granizo"
                  else -> "tempo indefinido"
              }

              private fun rd(d: Double): String = Math.round(d).toString()

              private fun ipLocation(log: (String) -> Unit): Triple<Double, Double, String>? {
                  try {
                      val j = JSONObject(http("https://ipwho.is/", "GET", null, API_UA, "application/json"))
                      if (j.optBoolean("success", false)) {
                          return Triple(j.getDouble("latitude"), j.getDouble("longitude"), j.optString("city", "") + ", " + j.optString("region", ""))
                      }
                  } catch (t: Throwable) {
                      log("IP (ipwho.is) falhou: " + t.message)
                  }
                  try {
                      val j = JSONObject(http("https://get.geojs.io/v1/ip/geo.json", "GET", null, API_UA, "application/json"))
                      return Triple(j.getString("latitude").toDouble(), j.getString("longitude").toDouble(), j.optString("city", "") + ", " + j.optString("region", ""))
                  } catch (t: Throwable) {
                      log("IP (geojs) falhou: " + t.message)
                  }
                  return null
              }

              private suspend fun weatherCtx(raw: String, savedCity: String, log: (String) -> Unit): WebCtx? {
                  return withContext(Dispatchers.IO) {
                      val explicit = cityFrom(raw)
                      val cityQ = if (explicit.isNotEmpty()) explicit else savedCity
                      var lat = 0.0
                      var lon = 0.0
                      var label = ""
                      var ok = false
                      var estimated = false
                      if (cityQ.isNotEmpty()) {
                          try {
                              val g = JSONObject(http("https://geocoding-api.open-meteo.com/v1/search?name=" + enc(cityQ) + "&count=1&language=pt&format=json", "GET", null, API_UA, "application/json"))
                              val arr = g.optJSONArray("results")
                              if (arr != null && arr.length() > 0) {
                                  val o = arr.getJSONObject(0)
                                  lat = o.getDouble("latitude")
                                  lon = o.getDouble("longitude")
                                  val adm = o.optString("admin1", "")
                                  label = o.optString("name", cityQ) + (if (adm.isNotEmpty()) ", " + adm else "") + ", " + o.optString("country", "")
                                  ok = true
                              }
                          } catch (t: Throwable) {
                              log("Geocodificação falhou: " + t.message)
                          }
                      }
                      if (!ok) {
                          val ip = ipLocation(log)
                          if (ip != null) {
                              lat = ip.first
                              lon = ip.second
                              label = ip.third
                              ok = true
                              estimated = true
                          }
                      }
                      if (!ok) return@withContext null
                      val url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
                          "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                          "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
                          "&timezone=auto&forecast_days=3"
                      val j = JSONObject(http(url, "GET", null, API_UA, "application/json"))
                      val cur = j.getJSONObject("current")
                      val d = j.getJSONObject("daily")
                      val sb = StringBuilder()
                      sb.append("Local: " + label + (if (estimated) " (local estimado pelo IP da TV)" else "") + ".\n")
                      sb.append("Agora: " + rd(cur.getDouble("temperature_2m")) + " graus, sensação de " + rd(cur.getDouble("apparent_temperature")) +
                          " graus, " + wmo(cur.optInt("weather_code", -1)) + ", umidade de " + rd(cur.optDouble("relative_humidity_2m", 0.0)) +
                          " por cento, vento de " + rd(cur.optDouble("wind_speed_10m", 0.0)) + " quilômetros por hora.\n")
                      val codes = d.getJSONArray("weather_code")
                      val tmax = d.getJSONArray("temperature_2m_max")
                      val tmin = d.getJSONArray("temperature_2m_min")
                      val pp = d.optJSONArray("precipitation_probability_max")
                      val names = listOf("Hoje", "Amanhã", "Depois de amanhã")
                      val n = minOf(3, codes.length(), tmax.length(), tmin.length())
                      for (i in 0 until n) {
                          var line = names[i] + ": mínima de " + rd(tmin.getDouble(i)) + ", máxima de " + rd(tmax.getDouble(i)) + " graus, " + wmo(codes.optInt(i, -1))
                          if (pp != null) {
                              val pr = pp.optDouble(i, -1.0)
                              if (pr >= 0.0) line += ", chance de chuva de " + rd(pr) + " por cento"
                          }
                          sb.append(line).append(".\n")
                      }
                      WebCtx(sb.toString(), if (explicit.isNotEmpty()) explicit else null)
                  }
              }
          }

          object JarvisCloud {
              private fun baseUrl(raw: String): String {
                  var b = raw.trim().trimEnd('/')
                  if (!b.startsWith("http://") && !b.startsWith("https://")) b = "https://" + b
                  return b
              }

              private fun open(base: String, path: String, key: String, method: String, connectMs: Int, readMs: Int): HttpURLConnection {
                  val c = URL(baseUrl(base) + path).openConnection() as HttpURLConnection
                  c.connectTimeout = connectMs
                  c.readTimeout = readMs
                  c.requestMethod = method
                  c.setRequestProperty("X-API-Key", key.trim())
                  c.setRequestProperty("X-Client", "tv")
                  c.setRequestProperty("ngrok-skip-browser-warning", "1")
                  c.setRequestProperty("Accept-Encoding", "identity")
                  c.setRequestProperty("User-Agent", "JarvisApp/2.0")
                  return c
              }

              fun health(base: String, key: String): Boolean {
                  val c = open(base, "/health", key, "GET", 8000, 15000)
                  try {
                      if (c.responseCode != 200) return false
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { r -> r.readText() }
                      return JSONObject(body).optBoolean("ok", false)
                  } finally {
                      c.disconnect()
                  }
              }

              fun stream(base: String, key: String, system: String, hist: List<Pair<Boolean, String>>, message: String, maxTokens: Int, onPiece: (String) -> Unit) {
                  val body = JSONObject()
                  body.put("system", system)
                  val arr = org.json.JSONArray()
                  for (h in hist) {
                      val o = JSONObject()
                      o.put("role", if (h.first) "user" else "assistant")
                      o.put("content", h.second)
                      arr.put(o)
                  }
                  body.put("history", arr)
                  body.put("message", message)
                  body.put("max_new_tokens", maxTokens)
                  body.put("temperature", 0.7)
                  val c = open(base, "/chat", key, "POST", 10000, 120000)
                  try {
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      c.setRequestProperty("Accept", "text/event-stream")
                      val bytes = body.toString().toByteArray(Charsets.UTF_8)
                      c.outputStream.use { os -> os.write(bytes) }
                      val rc = c.responseCode
                      if (rc != 200) {
                          var err = ""
                          try {
                              err = c.errorStream?.bufferedReader(Charsets.UTF_8)?.use { r -> r.readText() }?.take(200) ?: ""
                          } catch (t: Throwable) {
                          }
                          throw RuntimeException("HTTP " + rc + " " + err)
                      }
                      var gotDone = false
                      c.inputStream.bufferedReader(Charsets.UTF_8).use { r ->
                          while (true) {
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val js = JSONObject(line.substring(5).trim())
                              if (js.has("error")) throw RuntimeException(js.optString("error"))
                              val t = js.optString("t", "")
                              if (t.isNotEmpty()) onPiece(t)
                              if (js.optBoolean("done", false)) {
                                  gotDone = true
                                  break
                              }
                          }
                      }
                      if (!gotDone) throw RuntimeException("conexão encerrada antes do fim da resposta")
                  } finally {
                      c.disconnect()
                  }
              }
          }
          JVEOF

          cat > tv/app/src/main/kotlin/br/local/jarvis/tv/Orb.kt <<'JVEOF'
          package br.local.jarvis.tv

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt

          enum class St { IDLE, LISTENING, THINKING, SPEAKING }

          // Esfera branca de "sinapses": nós e conexões girando em 3D, com pulsos viajando pelas ligações.
          // A cor muda com o estado (mesma paleta da orbe antiga): branca em repouso, verde ouvindo, âmbar pensando, ciano falando.
          class SynapseOrb(ctx: Context) : View(ctx) {
              @Volatile var state: St = St.IDLE
              @Volatile var level: Float = 0f
              var centerY: Float = 0.42f

              private class Cand(val d: Float, val a: Int, val b: Int)

              private val outerCount = 104
              private val n = 124
              private val px = FloatArray(n)
              private val py = FloatArray(n)
              private val pz = FloatArray(n)
              private val sx = FloatArray(n)
              private val sy = FloatArray(n)
              private val sd = FloatArray(n)
              private var ea = IntArray(0)
              private var eb = IntArray(0)
              private var adj: Array<IntArray> = Array(0) { IntArray(0) }
              private var buckets: Array<FloatArray> = Array(4) { FloatArray(0) }
              private val bcount = IntArray(4)

              private val pm = 18
              private val pEdge = IntArray(pm)
              private val pT = FloatArray(pm)
              private val pSpeed = FloatArray(pm)
              private val pDir = IntArray(pm)
              private val rnd = java.util.Random(42L)

              private var yaw = 0f
              private var clock = 0f
              private var last = 0L
              private var cr = 255f
              private var cg = 255f
              private var cb = 255f
              private var hr = 159f
              private var hg = 216f
              private var hb = 255f
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val lineP = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  val golden = Math.PI * (3.0 - Math.sqrt(5.0))
                  for (i in 0 until outerCount) {
                      val y = 1.0 - 2.0 * (i + 0.5) / outerCount
                      val r = Math.sqrt(1.0 - y * y)
                      val th = golden * i
                      val x = Math.cos(th) * r + (rnd.nextDouble() - 0.5) * 0.07
                      val yy = y + (rnd.nextDouble() - 0.5) * 0.07
                      val z = Math.sin(th) * r + (rnd.nextDouble() - 0.5) * 0.07
                      val len = Math.sqrt(x * x + yy * yy + z * z)
                      px[i] = (x / len).toFloat()
                      py[i] = (yy / len).toFloat()
                      pz[i] = (z / len).toFloat()
                  }
                  for (i in outerCount until n) {
                      val gx = rnd.nextGaussian()
                      val gy = rnd.nextGaussian()
                      val gz = rnd.nextGaussian()
                      val len = Math.sqrt(gx * gx + gy * gy + gz * gz) + 0.000001
                      val rr = 0.28 + rnd.nextDouble() * 0.45
                      px[i] = (gx / len * rr).toFloat()
                      py[i] = (gy / len * rr).toFloat()
                      pz[i] = (gz / len * rr).toFloat()
                  }
                  buildEdges()
                  for (k in 0 until pm) resetPulse(k)
              }

              private fun buildEdges() {
                  val cands = ArrayList<Cand>()
                  for (i in 0 until n) {
                      for (j in (i + 1) until n) {
                          val dx = px[i] - px[j]
                          val dy = py[i] - py[j]
                          val dz = pz[i] - pz[j]
                          val d = sqrt(dx * dx + dy * dy + dz * dz)
                          val lim = if (i < outerCount && j < outerCount) 0.52f else 0.62f
                          if (d < lim) cands.add(Cand(d, i, j))
                      }
                  }
                  cands.sortBy { it.d }
                  val deg = IntArray(n)
                  val la = ArrayList<Int>()
                  val lb = ArrayList<Int>()
                  for (c in cands) {
                      if (deg[c.a] >= 6 || deg[c.b] >= 6) continue
                      deg[c.a] = deg[c.a] + 1
                      deg[c.b] = deg[c.b] + 1
                      la.add(c.a)
                      lb.add(c.b)
                  }
                  ea = IntArray(la.size) { la[it] }
                  eb = IntArray(lb.size) { lb[it] }
                  val tmp = Array(n) { ArrayList<Int>() }
                  for (e in ea.indices) {
                      tmp[ea[e]].add(e)
                      tmp[eb[e]].add(e)
                  }
                  adj = Array(n) { i -> IntArray(tmp[i].size) { k -> tmp[i][k] } }
                  buckets = Array(4) { FloatArray(ea.size * 4) }
              }

              private fun resetPulse(k: Int) {
                  if (ea.isEmpty()) return
                  pEdge[k] = rnd.nextInt(ea.size)
                  pT[k] = rnd.nextFloat()
                  pSpeed[k] = 0.45f + rnd.nextFloat() * 0.9f
                  pDir[k] = if (rnd.nextBoolean()) 1 else -1
              }

              // quando o pulso chega ao fim da ligação, continua por outra ligação do mesmo nó (o sinal "viaja" pela rede)
              private fun nextPulse(k: Int) {
                  val e = pEdge[k]
                  val node = if (pDir[k] > 0) eb[e] else ea[e]
                  val opts = adj[node]
                  if (opts.size > 1) {
                      var ne = e
                      var tries = 0
                      while (ne == e && tries < 5) {
                          ne = opts[rnd.nextInt(opts.size)]
                          tries++
                      }
                      pEdge[k] = ne
                      pDir[k] = if (ea[ne] == node) 1 else -1
                      pT[k] = 0f
                      pSpeed[k] = 0.45f + rnd.nextFloat() * 0.9f
                  } else {
                      resetPulse(k)
                      pT[k] = 0f
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  last = 0L
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w < 10f || h < 10f || ea.isEmpty()) return
                  val now = System.nanoTime()
                  var dt = if (last == 0L) 0.016f else (now - last) / 1000000000f
                  last = now
                  if (dt > 0.05f) dt = 0.05f
                  clock += dt

                  var spin = 0.14f
                  var mix = 0f
                  var tint = 0xFF9FD8FF.toInt()
                  var active = 5
                  var pSpd = 0.7f
                  var breathe = 0.012f
                  var breatheSpd = 0.9f
                  var glow = 1f
                  when (state) {
                      St.IDLE -> {
                      }
                      St.LISTENING -> {
                          spin = 0.22f
                          mix = 0.78f
                          tint = 0xFF00E676.toInt()
                          active = 9
                          pSpd = 1.0f
                          breathe = 0.02f
                          breatheSpd = 2.4f
                          glow = 1.1f
                      }
                      St.THINKING -> {
                          spin = 0.85f
                          mix = 0.8f
                          tint = 0xFFFFB300.toInt()
                          active = pm
                          pSpd = 2.2f
                          breathe = 0.01f
                          breatheSpd = 4f
                          glow = 1.15f
                      }
                      St.SPEAKING -> {
                          spin = 0.32f
                          mix = 0.7f
                          tint = 0xFF40C4FF.toInt()
                          active = 13
                          pSpd = 1.4f
                          breathe = 0.05f
                          breatheSpd = 3.2f
                          glow = 1.0f
                      }
                  }

                  // cor atual (suavizada) de nós e ligações, e cor do halo
                  val tr = Color.red(tint).toFloat()
                  val tg = Color.green(tint).toFloat()
                  val tb = Color.blue(tint).toFloat()
                  val k = Math.min(1f, dt * 5f)
                  cr += (255f + (tr - 255f) * mix - cr) * k
                  cg += (255f + (tg - 255f) * mix - cg) * k
                  cb += (255f + (tb - 255f) * mix - cb) * k
                  hr += (tr - hr) * k
                  hg += (tg - hg) * k
                  hb += (tb - hb) * k

                  var amp = 0f
                  if (state == St.LISTENING) {
                      amp = level
                  } else if (state == St.SPEAKING) {
                      amp = 0.35f + 0.35f * sin(clock * 6.5f) * sin(clock * 2.1f + 1f)
                  }
                  if (amp < 0f) amp = 0f
                  if (amp > 1f) amp = 1f

                  val cx = w / 2f
                  val cy = h * centerY
                  val baseR = Math.min(w, h) * 0.30f
                  val rad = baseR * (1f + breathe * sin(clock * breatheSpd) + amp * 0.10f)
                  val unit = rad / 200f

                  // halo suave
                  paint.style = Paint.Style.FILL
                  val haloA = Math.min(255, (13f * glow * (1f + amp)).toInt())
                  for (i in 0..6) {
                      paint.color = Color.argb(haloA, hr.toInt(), hg.toInt(), hb.toInt())
                      canvas.drawCircle(cx, cy, rad * (1f + 0.09f * i), paint)
                  }
                  // corpo e borda da esfera
                  paint.color = Color.argb(22, 255, 255, 255)
                  canvas.drawCircle(cx, cy, rad, paint)
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = unit * 1.6f
                  paint.color = Color.argb(90, cr.toInt(), cg.toInt(), cb.toInt())
                  canvas.drawCircle(cx, cy, rad, paint)
                  paint.style = Paint.Style.FILL

                  // rotação 3D
                  yaw += spin * dt * (1f + amp * 1.5f)
                  val tilt = 0.35f + 0.12f * sin(clock * 0.4f)
                  val cyaw = cos(yaw)
                  val syaw = sin(yaw)
                  val ct = cos(tilt)
                  val st = sin(tilt)
                  for (i in 0 until n) {
                      val x1 = px[i] * cyaw + pz[i] * syaw
                      val z1 = -px[i] * syaw + pz[i] * cyaw
                      val y2 = py[i] * ct - z1 * st
                      val z2 = py[i] * st + z1 * ct
                      var d = (z2 + 1f) * 0.5f
                      if (d < 0f) d = 0f
                      if (d > 1f) d = 1f
                      val s = 0.82f + 0.30f * d
                      sx[i] = cx + x1 * rad * s
                      sy[i] = cy + y2 * rad * s
                      sd[i] = d
                  }

                  // ligações, agrupadas por profundidade (4 faixas de brilho)
                  for (b in 0..3) bcount[b] = 0
                  for (e in ea.indices) {
                      val a = ea[e]
                      val b2 = eb[e]
                      val d = (sd[a] + sd[b2]) * 0.5f
                      var bi = (d * 4f).toInt()
                      if (bi > 3) bi = 3
                      if (bi < 0) bi = 0
                      val arr = buckets[bi]
                      val c = bcount[bi]
                      arr[c] = sx[a]
                      arr[c + 1] = sy[a]
                      arr[c + 2] = sx[b2]
                      arr[c + 3] = sy[b2]
                      bcount[bi] = c + 4
                  }
                  lineP.style = Paint.Style.STROKE
                  lineP.strokeCap = Paint.Cap.ROUND
                  for (b in 0..3) {
                      lineP.color = Color.argb(34 + b * 40, cr.toInt(), cg.toInt(), cb.toInt())
                      lineP.strokeWidth = unit * (0.9f + 0.55f * b)
                      canvas.drawLines(buckets[b], 0, bcount[b], lineP)
                  }

                  // nós
                  paint.style = Paint.Style.FILL
                  for (i in 0 until n) {
                      val d = sd[i]
                      val r = unit * (1.1f + 2.4f * d)
                      if (d > 0.72f) {
                          paint.color = Color.argb(38, cr.toInt(), cg.toInt(), cb.toInt())
                          canvas.drawCircle(sx[i], sy[i], r * 2.6f, paint)
                      }
                      paint.color = Color.argb(70 + (185f * d).toInt(), cr.toInt(), cg.toInt(), cb.toInt())
                      canvas.drawCircle(sx[i], sy[i], r, paint)
                  }

                  // pulsos de sinal
                  for (i in 0 until pm) {
                      pT[i] += dt * pSpeed[i] * pSpd
                      if (pT[i] >= 1f) nextPulse(i)
                      if (i >= active) continue
                      val e = pEdge[i]
                      val a = ea[e]
                      val b2 = eb[e]
                      val t = if (pDir[i] > 0) pT[i] else 1f - pT[i]
                      val x = sx[a] + (sx[b2] - sx[a]) * t
                      val y = sy[a] + (sy[b2] - sy[a]) * t
                      val d = (sd[a] + sd[b2]) * 0.5f
                      val r = unit * (2.2f + 2.0f * d)
                      paint.color = Color.argb(55 + (60f * d).toInt(), hr.toInt(), hg.toInt(), hb.toInt())
                      canvas.drawCircle(x, y, r * 2.8f, paint)
                      paint.color = Color.argb(150 + (100f * d).toInt(), 255, 255, 255)
                      canvas.drawCircle(x, y, r, paint)
                  }

                  postInvalidateOnAnimation()
              }
          }
          JVEOF

