              private fun setupWeb() {
                  try {
                      val w = WebView(this)
                      val s = w.settings
                      s.javaScriptEnabled = true
                      s.domStorageEnabled = true
                      s.loadWithOverviewMode = true
                      s.useWideViewPort = true
                      s.userAgentString = WEB_UA
                      w.isFocusable = false
                      w.isFocusableInTouchMode = false
                      w.setBackgroundColor(0xFF0A1220.toInt())
                      w.webViewClient = object : WebViewClient() {
                          override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                              runOnUiThread { webState(true, url) }
                          }

                          override fun onPageFinished(view: WebView?, url: String?) {
                              runOnUiThread { webState(false, url) }
                          }

                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                              val u = request?.url?.toString() ?: return false
                              return !(u.startsWith("http://") || u.startsWith("https://"))
                          }
                      }
                      webBox.addView(w, FrameLayout.LayoutParams(MATCH, MATCH))
                      web = w
                      w.loadDataWithBaseURL(null, IDLE_HTML, "text/html", "utf-8", null)
                  } catch (t: Throwable) {
                      web = null
                      val msg = tv("WebView não disponível nesta TV.", 26, Pal.MUTED)
                      msg.gravity = Gravity.CENTER
                      webBox.addView(msg, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
              }

              private fun webState(loading: Boolean, url: String?) {
                  webDot.background = shape(if (loading) Pal.WARN else Pal.OK, 10, 0)
                  var host = ""
                  if (url != null && url.startsWith("http")) {
                      host = try {
                          java.net.URL(url).host.removePrefix("www.")
                      } catch (t: Throwable) {
                          ""
                      }
                  }
                  webHost.text = if (host.isEmpty()) "PESQUISA AO VIVO" else host.uppercase()
              }

              private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8")

              private fun showSearchPage(mode: WebMode, text: String) {
                  val w = web ?: return
                  val url = when (mode) {
                      WebMode.NEWS -> {
                          val topic = JarvisWeb.newsTopic(text)
                          if (topic.isBlank()) "https://news.google.com/?hl=pt-BR&gl=BR&ceid=BR:pt-419"
                          else "https://news.google.com/search?q=" + enc(topic) + "&hl=pt-BR&gl=BR&ceid=BR:pt-419"
                      }
                      WebMode.WEATHER -> {
                          val c = JarvisWeb.cityFrom(text).ifEmpty { gs("city") }
                          "https://www.bing.com/search?q=" + enc("previsão do tempo " + c) + "&setlang=pt-BR&cc=BR"
                      }
                      else -> "https://www.bing.com/search?q=" + enc(JarvisWeb.cleanQuery(text)) + "&setlang=pt-BR&cc=BR"
                  }
                  try {
                      w.loadUrl(url)
                  } catch (t: Throwable) {
                  }
              }

              // depois da pesquisa, o WebView "visita" os primeiros resultados, um de cada vez
              private fun visitUrls(urls: List<String>) {
                  val w = web ?: return
                  visitGen++
                  val gen = visitGen
                  var delay = 1500L
                  for (u in urls.take(3)) {
                      ui.postDelayed({
                          if (gen == visitGen) {
                              try {
                                  w.loadUrl(u)
                              } catch (t: Throwable) {
                              }
                          }
                      }, delay)
                      delay += 7000L
                  }
              }

